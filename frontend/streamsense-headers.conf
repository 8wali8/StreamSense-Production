# Shared response headers; included at server level and in every location that adds its own headers.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# The console is a same-origin app: scripts and API calls stay on this host, styles are React inline
# style attributes, the only frame is the Twitch player, and images may come from data/blob URLs.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-src https://player.twitch.tv; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
