# Serves the built console and proxies the three backend routes the app uses. Runs as the
# unprivileged nginx user on 8080 (nginxinc/nginx-unprivileged); nothing here needs root.

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

# Cache-Control per asset class: hashed bundles are immutable, the HTML shell is revalidated on every load.
map $uri $asset_cache_control {
  ~^/assets/ "public, max-age=31536000, immutable";
  default    "no-cache";
}

server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  client_max_body_size 1m;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 5;
  gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

  # Security headers on every response. nginx's add_header is not inherited by a location that sets
  # its own headers, so the shared file is included again in those locations.
  include /etc/nginx/streamsense-headers.conf;

  # Liveness/readiness for Compose and Kubernetes; no upstream involved.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location /assets/ {
    include /etc/nginx/streamsense-headers.conf;
    # No `always`: the immutable policy applies to successful responses only. A missing hashed asset
    # (old and new pods serving together during a rollout) must not be cached for a year.
    add_header Cache-Control $asset_cache_control;
    try_files $uri @asset_missing;
  }

  location @asset_missing {
    include /etc/nginx/streamsense-headers.conf;
    add_header Cache-Control "no-store" always;
    return 404;
  }

  location / {
    include /etc/nginx/streamsense-headers.conf;
    add_header Cache-Control $asset_cache_control always;
    try_files $uri $uri/ /index.html;
  }

  location /graphql {
    proxy_pass http://api-gateway:8080/graphql;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Subscriptions are long-lived WebSocket connections.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location /api/ {
    # Frame uploads go through /api/video/upload-frame.
    client_max_body_size 10m;
    proxy_pass http://api-gateway:8080/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # ml-engine is reachable only for the one endpoint the console calls, and only through the
  # gateway, whose auth and rate-limit filters cover it; its other routes (transcription, sponsor
  # detection, health) are internal to the services.
  location = /ml/segment {
    limit_except POST {
      deny all;
    }
    client_max_body_size 1m;
    proxy_pass http://api-gateway:8080/ml/segment;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # The SAM backend's first call downloads and initialises the model; matches the gateway route.
    proxy_read_timeout 180s;
  }

  location /ml/ {
    return 404;
  }
}
