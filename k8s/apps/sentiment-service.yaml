apiVersion: v1
kind: Service
metadata:
  name: sentiment-service
  namespace: streamsense
spec:
  selector:
    app: sentiment-service
  ports:
    - name: http
      port: 8083
      targetPort: 8083
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentiment-service
  namespace: streamsense
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sentiment-service
  template:
    metadata:
      labels:
        app: sentiment-service
    spec:
      initContainers:
        - name: wait-for-config-server
          image: busybox:1.36
          command:
            - sh
            - -c
            - until wget -qO- http://config-server:8888/actuator/health; do sleep 2; done
        - name: wait-for-eureka
          image: busybox:1.36
          command:
            - sh
            - -c
            - until wget -qO- http://eureka-server:8761/actuator/health; do sleep 2; done
        - name: wait-for-kafka
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z kafka 9092; do sleep 2; done
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z postgres 5432; do sleep 2; done
        - name: wait-for-redis
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z redis 6379; do sleep 2; done
        - name: wait-for-ml-engine
          image: busybox:1.36
          command:
            - sh
            - -c
            - until wget -qO- http://ml-engine:8000/ml/health; do sleep 2; done
      containers:
        - name: sentiment-service
          image: streamsense/sentiment-service:sprint9
          imagePullPolicy: IfNotPresent
          env:
            - name: CONFIG_SERVER_URL
              value: http://config-server:8888
            - name: EUREKA_DEFAULT_ZONE
              value: http://eureka-server:8761/eureka
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
            - name: EUREKA_INSTANCE_PREFER_IP_ADDRESS
              value: "true"
          ports:
            - containerPort: 8083
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 25
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 50
            periodSeconds: 20
            timeoutSeconds: 5
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            failureThreshold: 60
            periodSeconds: 10
            timeoutSeconds: 5
