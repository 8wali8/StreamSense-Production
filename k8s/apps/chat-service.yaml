apiVersion: v1
kind: Service
metadata:
  name: chat-service
  namespace: streamsense
spec:
  selector:
    app: chat-service
  ports:
    - name: http
      port: 8081
      targetPort: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-service
  namespace: streamsense
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chat-service
  template:
    metadata:
      labels:
        app: chat-service
    spec:
      initContainers:
        - name: wait-for-config-server
          image: busybox:1.36
          command:
            - sh
            - -c
            - until wget -qO- http://config-server:8888/actuator/health; do sleep 2; done
        - name: wait-for-eureka
          image: busybox:1.36
          command:
            - sh
            - -c
            - until wget -qO- http://eureka-server:8761/actuator/health; do sleep 2; done
        - name: wait-for-kafka
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z kafka 9092; do sleep 2; done
      containers:
        - name: chat-service
          image: streamsense/chat-service:sprint9
          imagePullPolicy: IfNotPresent
          env:
            - name: CONFIG_SERVER_URL
              value: http://config-server:8888
            - name: EUREKA_DEFAULT_ZONE
              value: http://eureka-server:8761/eureka
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
            - name: EUREKA_INSTANCE_PREFER_IP_ADDRESS
              value: "true"
            - name: STREAMSENSE_TWITCH_CHAT_ENABLED
              value: "false"
            - name: TWITCH_CHAT_HOST
              value: irc.chat.twitch.tv
            - name: TWITCH_CHAT_PORT
              value: "6697"
            - name: TWITCH_CHAT_SSL
              value: "true"
            - name: TWITCH_CHAT_USERNAME
              value: ""
            - name: TWITCH_CHAT_OAUTH_TOKEN
              value: ""
            - name: TWITCH_CHANNELS
              value: ""
          ports:
            - containerPort: 8081
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 40
            periodSeconds: 20
            timeoutSeconds: 5
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            failureThreshold: 60
            periodSeconds: 10
            timeoutSeconds: 5
