apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: streamsense
  labels:
    app: frontend
spec:
  selector:
    app: frontend
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: streamsense
  labels:
    app: frontend
spec:
  # Two stateless nginx replicas so the PodDisruptionBudget below can keep one serving while a node
  # drains. The gateway stays at one replica: its Kafka consumers share one group id, so a second
  # replica would split the partitions and subscribers on either pod would miss events.
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: frontend
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        # The /tmp and /var/cache/nginx emptyDirs are owned by this group, so nginx (uid 101) can write
        # its pid file and temp files regardless of how the kubelet initialises the volume roots.
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: streamsense/frontend:sprint9
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          # nginx-unprivileged writes its pid and proxy buffers under /tmp and its cache under
          # /var/cache/nginx; both are scratch space, so emptyDir keeps the root filesystem read-only.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/cache/nginx
      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: frontend
  namespace: streamsense
  labels:
    app: frontend
spec:
  minAvailable: 1
  # an unhealthy replica never blocks a drain
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app: frontend
