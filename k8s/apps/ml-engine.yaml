apiVersion: v1
kind: Service
metadata:
  name: ml-engine
  namespace: streamsense
spec:
  selector:
    app: ml-engine
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-engine
  namespace: streamsense
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ml-engine
  template:
    metadata:
      labels:
        app: ml-engine
    spec:
      containers:
        - name: ml-engine
          image: streamsense/ml-engine:sprint9
          imagePullPolicy: IfNotPresent
          env:
            - name: STREAMSENSE_FRAME_STORAGE_ENDPOINT
              value: http://minio:9000
            - name: STREAMSENSE_FRAME_STORAGE_REGION
              value: us-east-1
            - name: STREAMSENSE_FRAME_STORAGE_ACCESS_KEY
              value: streamsense
            - name: STREAMSENSE_FRAME_STORAGE_SECRET_KEY
              value: streamsense
            - name: STREAMSENSE_SPONSOR_REQUIRE_FRAME_READ
              value: "false"
            - name: STREAMSENSE_WHISPER_MODEL
              value: small.en
            - name: STREAMSENSE_WHISPER_COMPUTE_TYPE
              value: int8
            - name: STREAMSENSE_WHISPER_DEVICE
              value: cpu
            - name: STREAMSENSE_WHISPER_LANGUAGE
              value: en
            - name: STREAMSENSE_WHISPER_MODEL_CACHE
              value: /models/whisper
            - name: STREAMSENSE_RELEVANCE_BACKEND
              value: sentence-transformers
            - name: STREAMSENSE_RELEVANCE_MODEL
              value: sentence-transformers/all-MiniLM-L6-v2
            - name: STREAMSENSE_RELEVANCE_DEVICE
              value: cpu
            - name: STREAMSENSE_RELEVANCE_CACHE_DIR
              value: /models/relevance
            - name: STREAMSENSE_RELEVANCE_MIN_SCORE
              value: "0.50"
            - name: STREAMSENSE_RELEVANCE_PRELOAD
              value: "false"
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: whisper-model-cache
              mountPath: /models/whisper
            - name: relevance-model-cache
              mountPath: /models/relevance
          readinessProbe:
            httpGet:
              path: /ml/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /ml/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
      volumes:
        - name: whisper-model-cache
          emptyDir: {}
        - name: relevance-model-cache
          emptyDir: {}
