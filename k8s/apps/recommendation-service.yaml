apiVersion: v1
kind: Service
metadata:
  name: recommendation-service
  namespace: streamsense
spec:
  selector:
    app: recommendation-service
  ports:
    - name: http
      port: 8082
      targetPort: 8082
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendation-service
  namespace: streamsense
spec:
  replicas: 1
  selector:
    matchLabels:
      app: recommendation-service
  template:
    metadata:
      labels:
        app: recommendation-service
    spec:
      initContainers:
        - name: wait-for-config-server
          image: busybox:1.36
          command:
            - sh
            - -c
            - until wget -qO- http://config-server:8888/actuator/health; do sleep 2; done
        - name: wait-for-eureka
          image: busybox:1.36
          command:
            - sh
            - -c
            - until wget -qO- http://eureka-server:8761/actuator/health; do sleep 2; done
        - name: wait-for-sentiment-service
          image: busybox:1.36
          command:
            - sh
            - -c
            - until wget -qO- http://sentiment-service:8083/actuator/health; do sleep 2; done
        - name: wait-for-video-service
          image: busybox:1.36
          command:
            - sh
            - -c
            - until wget -qO- http://video-service:8084/actuator/health; do sleep 2; done
      containers:
        - name: recommendation-service
          image: streamsense/recommendation-service:sprint9
          imagePullPolicy: IfNotPresent
          env:
            - name: CONFIG_SERVER_URL
              value: http://config-server:8888
            - name: EUREKA_DEFAULT_ZONE
              value: http://eureka-server:8761/eureka
            - name: EUREKA_INSTANCE_PREFER_IP_ADDRESS
              value: "true"
          ports:
            - containerPort: 8082
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 40
            periodSeconds: 20
            timeoutSeconds: 5
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            failureThreshold: 60
            periodSeconds: 10
            timeoutSeconds: 5
