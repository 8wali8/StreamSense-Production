apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: streamsense
spec:
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: streamsense
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      initContainers:
        - name: wait-for-config-server
          image: busybox:1.36.1@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
          command:
            - sh
            - -c
            - until wget -qO- http://config-server:8888/actuator/health; do sleep 2; done
        - name: wait-for-eureka
          image: busybox:1.36.1@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
          command:
            - sh
            - -c
            - until wget -qO- http://eureka-server:8761/actuator/health; do sleep 2; done
        - name: wait-for-kafka
          image: busybox:1.36.1@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
          command:
            - sh
            - -c
            - until nc -z kafka 9092; do sleep 2; done
        - name: wait-for-recommendation-service
          image: busybox:1.36.1@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
          command:
            - sh
            - -c
            - until wget -qO- http://recommendation-service:8082/actuator/health; do sleep 2; done
        - name: wait-for-analytics-service
          image: busybox:1.36.1@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
          command:
            - sh
            - -c
            - until wget -qO- http://analytics-service:8085/actuator/health; do sleep 2; done
      containers:
        - name: api-gateway
          image: streamsense/api-gateway:sprint9
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1536Mi
          imagePullPolicy: IfNotPresent
          env:
            - name: CONFIG_SERVER_URL
              value: http://config-server:8888
            - name: EUREKA_DEFAULT_ZONE
              value: http://eureka-server:8761/eureka
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
            - name: STREAMSENSE_GATEWAY_AUTH_ENABLED
              value: "false"
            # Required once auth is enabled; the gateway refuses to start without it.
            - name: STREAMSENSE_GATEWAY_AUTH_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: streamsense-secrets
                  key: STREAMSENSE_GATEWAY_AUTH_HMAC_SECRET
                  optional: true
            - name: STREAMSENSE_GATEWAY_RATE_LIMIT_ENABLED
              value: "true"
            # Two proxies we operate can sit in front of the gateway: ingress-nginx, and the console's
            # nginx when a request comes through streamsense.local. ingress-nginx overwrites
            # X-Forwarded-For with the real client, the console appends the ingress address, so the
            # client is the second entry from the right; a direct gateway.streamsense.local request has
            # only one entry and the resolver clamps to it. Set back to "0" if ingress-nginx is ever
            # switched to use-forwarded-headers, which would make the header client-controlled.
            - name: STREAMSENSE_GATEWAY_TRUSTED_PROXY_HOPS
              value: "2"
            - name: EUREKA_INSTANCE_PREFER_IP_ADDRESS
              value: "true"
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 25
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 45
            periodSeconds: 20
            timeoutSeconds: 5
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            failureThreshold: 60
            periodSeconds: 10
            timeoutSeconds: 5
