apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: streamsense-gateway-ingress
  namespace: streamsense
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: gateway.streamsense.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: streamsense-grafana-ingress
  namespace: streamsense
spec:
  ingressClassName: nginx
  rules:
    - host: grafana.streamsense.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: streamsense-zipkin-ingress
  namespace: streamsense
spec:
  ingressClassName: nginx
  rules:
    - host: zipkin.streamsense.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: zipkin
                port:
                  number: 9411
