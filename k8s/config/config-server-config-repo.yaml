apiVersion: v1
kind: ConfigMap
metadata:
  name: config-server-native-repo
  namespace: streamsense
data:
  application.yml: |
    logging:
      pattern:
        level: "%5p [traceId=%X{traceId:-}, spanId=%X{spanId:-}, correlationId=%X{correlationId:-}]"

    management:
      endpoints:
        web:
          exposure:
            include: health, info, prometheus
      endpoint:
        prometheus:
          enabled: true
      tracing:
        sampling:
          probability: 1.0
      zipkin:
        tracing:
          endpoint: http://zipkin:9411/api/v2/spans
  api-gateway.yml: |
    server:
      port: 8080

    eureka:
      client:
        service-url:
          defaultZone: ${EUREKA_DEFAULT_ZONE:http://eureka-server:8761/eureka}

    streamsense:
      topics:
        chatMessages: stream.chat.messages
        sentimentEvents: stream.sentiment.events
        transcriptSegments: stream.transcript.segments
        transcriptSentimentEvents: stream.transcript.sentiment.events
        sponsorDetections: stream.sponsor.detections
      services:
        chat-service:
          base-url: http://chat-service:8081
        recommendation-service:
          base-url: http://recommendation-service:8082
        sentiment-service:
          base-url: http://sentiment-service:8083
        video-service:
          base-url: http://video-service:8084
        video-capture-service:
          base-url: http://video-capture-service:8090
        analytics-service:
          base-url: http://analytics-service:8085
      gateway:
        rate-limit-enabled: ${STREAMSENSE_GATEWAY_RATE_LIMIT_ENABLED:true}
        trusted-proxy-hops: ${STREAMSENSE_GATEWAY_TRUSTED_PROXY_HOPS:0}
        auth:
          enabled: ${STREAMSENSE_GATEWAY_AUTH_ENABLED:false}
          required-issuer: streamsense-local
          required-audience: streamsense-clients
          hmac-secret: ${STREAMSENSE_GATEWAY_AUTH_HMAC_SECRET:}
          protected-paths:
            - /graphql
            - /api/**
          excluded-paths:
            - /actuator/**
            - /graphiql
            - /graphiql/**
        rate-limits:
          - id: chat-ingest
            path: /api/chat/ingest
            method: POST
            requests: 30
            window-seconds: 60
          - id: video-upload
            path: /api/video/upload-frame
            method: POST
            requests: 20
            window-seconds: 60

    spring:
      kafka:
        bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
        consumer:
          group-id: api-gateway-subscriptions
          client-id: api-gateway-subscriptions
          auto-offset-reset: latest
          key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
          value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
          properties:
            partition.assignment.strategy: org.apache.kafka.clients.consumer.CooperativeStickyAssignor
            spring.json.trusted.packages: com.streamsense.apigateway.events
            spring.json.value.default.type: com.streamsense.apigateway.events.ChatMessageEvent
            spring.json.use.type.headers: false

      cloud:
        gateway:
          metrics:
            enabled: true
          routes:
            - id: chat-service-api
              uri: ${streamsense.services.chat-service.base-url}
              predicates:
                - Path=/api/chat/**
            - id: sentiment-service-api
              uri: ${streamsense.services.sentiment-service.base-url}
              predicates:
                - Path=/api/sentiment/**
            - id: recommendation-service-api
              uri: ${streamsense.services.recommendation-service.base-url}
              predicates:
                - Path=/api/recommendations/**
            - id: video-capture-service-api
              uri: ${streamsense.services.video-capture-service.base-url}
              predicates:
                - Path=/api/video/capture/**
            - id: video-service-api
              uri: ${streamsense.services.video-service.base-url}
              predicates:
                - Path=/api/video/**
            - id: analytics-service-api
              uri: ${streamsense.services.analytics-service.base-url}
              predicates:
                - Path=/api/analytics/**

      graphql:
        graphiql:
          enabled: true
        websocket:
          path: /graphql
  chat-service.yml: |
    server:
      port: 8081

    eureka:
      client:
        service-url:
          defaultZone: ${EUREKA_DEFAULT_ZONE:http://eureka-server:8761/eureka}

    streamsense:
      topics:
        chatMessages: stream.chat.messages
      twitch:
        chat:
          enabled: ${STREAMSENSE_TWITCH_CHAT_ENABLED:false}
          host: ${TWITCH_CHAT_HOST:irc.chat.twitch.tv}
          port: ${TWITCH_CHAT_PORT:6697}
          ssl: ${TWITCH_CHAT_SSL:true}
          username: ${TWITCH_CHAT_USERNAME:}
          oauth-token: ${TWITCH_CHAT_OAUTH_TOKEN:}
          channels: ${TWITCH_CHANNELS:}
          reconnect-delay-ms: ${TWITCH_CHAT_RECONNECT_DELAY_MS:5000}
          max-reconnect-delay-ms: ${TWITCH_CHAT_MAX_RECONNECT_DELAY_MS:60000}
          connection-timeout-ms: ${TWITCH_CHAT_CONNECTION_TIMEOUT_MS:10000}
      replay:
        aliases:
          redbull-testing:
            provider: twitch
            vod-id: "2750461300"
            vod-url: "https://www.twitch.tv/videos/2750461300"
            replay-speed: 1.0
            start-offset-seconds: 1800
            source: TWITCH_VOD_REPLAY
            loop: true
            chat-fixture-path: classpath:replay/redbull-testing-chat.json
        twitch-graphql:
          endpoint: ${TWITCH_GQL_ENDPOINT:https://gql.twitch.tv/gql}
          client-id: ${TWITCH_GQL_CLIENT_ID:kimne78kx3ncx6brgo4mv6wki5h1ko}
          request-timeout-ms: ${TWITCH_GQL_REQUEST_TIMEOUT_MS:10000}
          max-pages: ${TWITCH_GQL_MAX_PAGES:200}

    spring:
      kafka:
        bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
        producer:
          key-serializer: org.apache.kafka.common.serialization.StringSerializer
          value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  sentiment-service.yml: |
    server:
      port: 8083

    eureka:
      client:
        service-url:
          defaultZone: ${EUREKA_DEFAULT_ZONE:http://eureka-server:8761/eureka}

    streamsense:
      topics:
        chatMessages: stream.chat.messages
        sentimentEvents: stream.sentiment.events
        chatMessagesDlt: stream.chat.messages.dlt
        transcriptSegments: stream.transcript.segments
        transcriptSentimentEvents: stream.transcript.sentiment.events
        transcriptSegmentsDlt: stream.transcript.segments.dlt
      ml:
        base-url: http://ml-engine:8000
        connectTimeoutMs: 2000
        readTimeoutMs: 10000
      history:
        defaultLimit: 20
        maxLimit: 100
      cache:
        recentPrefix: sentiment:recent
        recentTtlSeconds: 60
      processing:
        retryBackoffMs: 1000
        maxRetries: 2
      sentiment:
        relevance:
          enabled: true
          minScore: 0.50
          sponsors:
            - name: Nike
              aliases: [nike, swoosh, just do it]
              semanticTerms: [shoes, sneakers, kicks, running shoes, apparel, sportswear, trainers]
            - name: Prime
              aliases: [prime, prime hydration]
              semanticTerms: [hydration, drink, energy drink, bottle]
            - name: Razer
              aliases: [razer]
              semanticTerms: [keyboard, mouse, headset, gaming gear, peripherals]
            - name: Red Bull
              aliases: [red bull, redbull, rb]
              semanticTerms: [energy drink, energy, drink, can, wings, caffeine, extreme sports, f1, formula 1, racing]
          seeds:
            - streamer: redbull-testing
              sponsor: Red Bull

    hystrix:
      command:
        mlSentiment:
          executionTimeoutMs: 3000
          requestVolumeThreshold: 10
          errorThresholdPercentage: 50
          sleepWindowMs: 15000
          maxConcurrentCalls: 4
          maxRetries: 2

    spring:
      kafka:
        bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
        consumer:
          group-id: sentiment-service
          auto-offset-reset: earliest
          key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
          value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
          properties:
            spring.json.trusted.packages: "*"
            spring.json.value.default.type: com.streamsense.sentimentservice.events.ChatMessageEvent
            spring.json.use.type.headers: false
        producer:
          key-serializer: org.apache.kafka.common.serialization.StringSerializer
          value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

      datasource:
        url: jdbc:postgresql://postgres:5432/streamsense
        username: streamsense
        password: ${POSTGRES_PASSWORD}
        driver-class-name: org.postgresql.Driver

      jpa:
        hibernate:
          ddl-auto: validate
        properties:
          hibernate:
            dialect: org.hibernate.dialect.PostgreSQLDialect

      flyway:
        enabled: true
        locations: classpath:db/migration
        baseline-on-migrate: true
        baseline-version: 0

      data:
        redis:
          host: redis
          port: 6379
          repositories:
            enabled: false
          timeout: 2s

    resilience4j:
      circuitbreaker:
        instances:
          mlSentiment:
            slidingWindowType: COUNT_BASED
            slidingWindowSize: 10
            minimumNumberOfCalls: 5
            failureRateThreshold: 50
            waitDurationInOpenState: 15s
            permittedNumberOfCallsInHalfOpenState: 2
            automaticTransitionFromOpenToHalfOpenEnabled: true
            recordExceptions:
              - com.streamsense.sentimentservice.client.MlDependencyException
      retry:
        instances:
          mlSentiment:
            maxAttempts: 3
            waitDuration: 1s
            retryExceptions:
              - com.streamsense.sentimentservice.client.MlDependencyException
              - io.github.resilience4j.circuitbreaker.CallNotPermittedException
              - io.github.resilience4j.bulkhead.BulkheadFullException
            ignoreExceptions:
              - java.lang.IllegalStateException
              - java.lang.IllegalArgumentException
      bulkhead:
        instances:
          mlSentiment:
            maxConcurrentCalls: 4
            maxWaitDuration: 0ms

    management:
      health:
        circuitbreakers:
          enabled: true
  video-service.yml: |
    server:
      port: 8084

    eureka:
      client:
        service-url:
          defaultZone: ${EUREKA_DEFAULT_ZONE:http://eureka-server:8761/eureka}

    streamsense:
      topics:
        videoFrames: stream.video.frames
        videoFramesDlt: stream.video.frames.dlt
        sponsorDetections: stream.sponsor.detections
      ml:
        base-url: http://ml-engine:8000
        connectTimeoutMs: 2000
        readTimeoutMs: 3000
      history:
        defaultLimit: 20
        maxLimit: 100
      cache:
        recentPrefix: sponsor:recent
        recentTtlSeconds: 60
      payload:
        maxFrameRefLength: 1024
      processing:
        retryBackoffMs: 1000
        maxRetries: 2

    hystrix:
      command:
        mlSponsor:
          executionTimeoutMs: 3000
          requestVolumeThreshold: 10
          errorThresholdPercentage: 50
          sleepWindowMs: 15000
          maxConcurrentCalls: 4
          maxRetries: 2

    resilience4j:
      circuitbreaker:
        instances:
          mlSponsor:
            slidingWindowType: COUNT_BASED
            slidingWindowSize: 10
            minimumNumberOfCalls: 5
            failureRateThreshold: 50
            waitDurationInOpenState: 15s
            permittedNumberOfCallsInHalfOpenState: 2
            automaticTransitionFromOpenToHalfOpenEnabled: true
            recordExceptions:
              - com.streamsense.videoservice.client.MlDependencyException
      retry:
        instances:
          mlSponsor:
            maxAttempts: 3
            waitDuration: 1s
            retryExceptions:
              - com.streamsense.videoservice.client.MlDependencyException
              - io.github.resilience4j.circuitbreaker.CallNotPermittedException
              - io.github.resilience4j.bulkhead.BulkheadFullException
            ignoreExceptions:
              - java.lang.IllegalStateException
              - java.lang.IllegalArgumentException
      bulkhead:
        instances:
          mlSponsor:
            maxConcurrentCalls: 4
            maxWaitDuration: 0ms

    spring:
      kafka:
        bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
        consumer:
          group-id: video-service
          auto-offset-reset: earliest
          key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
          value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
          properties:
            spring.json.trusted.packages: "*"
            spring.json.value.default.type: com.streamsense.videoservice.events.FrameData
            spring.json.use.type.headers: false
        producer:
          key-serializer: org.apache.kafka.common.serialization.StringSerializer
          value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

      datasource:
        url: jdbc:postgresql://postgres:5432/streamsense
        username: streamsense
        password: ${POSTGRES_PASSWORD}
        driver-class-name: org.postgresql.Driver

      jpa:
        hibernate:
          ddl-auto: validate
        properties:
          hibernate:
            dialect: org.hibernate.dialect.PostgreSQLDialect

      flyway:
        enabled: true
        locations: classpath:db/migration
        table: video_service_flyway_history
        baseline-on-migrate: true
        baseline-version: 0

      data:
        redis:
          host: redis
          port: 6379
          repositories:
            enabled: false
          timeout: 2s

    management:
      health:
        circuitbreakers:
          enabled: true
  analytics-service.yml: |
    server:
      port: 8085

    eureka:
      client:
        service-url:
          defaultZone: ${EUREKA_DEFAULT_ZONE:http://eureka-server:8761/eureka}

    streamsense:
      topics:
        chatMessages: stream.chat.messages
        chatMessagesDlt: stream.chat.messages.analytics.dlt
        sentimentEvents: stream.sentiment.events
        sentimentEventsDlt: stream.sentiment.events.analytics.dlt
        sponsorDetections: stream.sponsor.detections
        sponsorDetectionsDlt: stream.sponsor.detections.analytics.dlt
        transcriptSentimentEvents: stream.transcript.sentiment.events
        transcriptSentimentEventsDlt: stream.transcript.sentiment.events.analytics.dlt
      processing:
        retryBackoffMs: ${STREAMSENSE_ANALYTICS_RETRY_BACKOFF_MS:1000}
        maxRetries: ${STREAMSENSE_ANALYTICS_MAX_RETRIES:2}
      analytics:
        bucket-size-seconds: ${STREAMSENSE_ANALYTICS_BUCKET_SIZE_SECONDS:60}
        default-window-minutes: ${STREAMSENSE_ANALYTICS_DEFAULT_WINDOW_MINUTES:15}
        max-window-minutes: ${STREAMSENSE_ANALYTICS_MAX_WINDOW_MINUTES:1440}
        estimated-sponsor-exposure-ms-per-detection: ${STREAMSENSE_ANALYTICS_SPONSOR_EXPOSURE_MS_PER_DETECTION:10000}
        minimum-sponsor-confidence: ${STREAMSENSE_ANALYTICS_MINIMUM_SPONSOR_CONFIDENCE:0.50}
        negative-spike-ratio-threshold: ${STREAMSENSE_ANALYTICS_NEGATIVE_SPIKE_RATIO_THRESHOLD:0.60}
        negative-spike-minimum-events: ${STREAMSENSE_ANALYTICS_NEGATIVE_SPIKE_MINIMUM_EVENTS:10}
        engagement-spike-minimum-messages: ${STREAMSENSE_ANALYTICS_ENGAGEMENT_SPIKE_MINIMUM_MESSAGES:20}
        engagement-spike-multiplier: ${STREAMSENSE_ANALYTICS_ENGAGEMENT_SPIKE_MULTIPLIER:2.0}
        engagement-spike-trailing-window-minutes: ${STREAMSENSE_ANALYTICS_ENGAGEMENT_SPIKE_TRAILING_WINDOW_MINUTES:5}
        low-data-minimum-events: ${STREAMSENSE_ANALYTICS_LOW_DATA_MINIMUM_EVENTS:5}

    spring:
      kafka:
        bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
        consumer:
          group-id: analytics-service
          auto-offset-reset: earliest
          key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
          value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

      datasource:
        url: jdbc:postgresql://postgres:5432/streamsense
        username: streamsense
        password: ${POSTGRES_PASSWORD}
        driver-class-name: org.postgresql.Driver

      flyway:
        enabled: true
        locations: classpath:db/migration
        table: analytics_service_flyway_history
        baseline-on-migrate: true
        baseline-version: 0

    management:
      endpoints:
        web:
          exposure:
            include: health, info, prometheus
      endpoint:
        prometheus:
          enabled: true
  recommendation-service.yml: |
    server:
      port: 8082

    eureka:
      client:
        service-url:
          defaultZone: ${EUREKA_DEFAULT_ZONE:http://eureka-server:8761/eureka}

    streamsense:
      services:
        sentiment-service:
          base-url: http://sentiment-service:8083
        video-service:
          base-url: http://video-service:8084
      recommendations:
        defaultLimit: 3
        maxLimit: 6
        signalWindowLimit: 20
        refreshMode: restart
        experimentName: recommendation-ranking-v1
        activeVariant: balanced
        variants:
          balanced:
            enabled: true
            positiveWeight: 1.0
            sponsorWeight: 0.9
            cautionWeight: 1.1
            momentumThreshold: 0.15
            sponsorConfidenceThreshold: 0.65
          sponsorBoost:
            enabled: true
            positiveWeight: 0.85
            sponsorWeight: 1.25
            cautionWeight: 1.0
            momentumThreshold: 0.10
            sponsorConfidenceThreshold: 0.55

    management:
      endpoints:
        web:
          exposure:
            include: health,info,prometheus
