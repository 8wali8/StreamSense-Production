apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Apply from the repository root (`kubectl apply -k .`): the root kustomization adds the
# config-server ConfigMap generated from config-server/config-repo, which this directory
# cannot reach on its own.
resources:
  - platform/storage.yaml
  - namespace.yaml
  - config/prometheus-config.yaml
  - config/grafana-config.yaml
  - platform/eureka-server.yaml
  - platform/config-server.yaml
  - platform/postgres.yaml
  - platform/redis.yaml
  - platform/minio.yaml
  - platform/kafka.yaml
  - apps/ml-engine.yaml
  - apps/video-capture-service.yaml
  - apps/chat-service.yaml
  - apps/sentiment-service.yaml
  - apps/video-service.yaml
  - apps/recommendation-service.yaml
  - apps/analytics-service.yaml
  - apps/api-gateway.yaml
  - monitoring/prometheus.yaml
  - monitoring/grafana.yaml
  - monitoring/zipkin.yaml
  - monitoring/kafka-exporter.yaml
  - ingress/streamsense-ingress.yaml

# Credentials come from a git-ignored env file that `make secrets` writes with random values
# (see secrets/streamsense.env.example). kustomize appends a content hash to the Secret name and
# rewrites every secretKeyRef to match, so changing a value and re-applying rolls the pods that
# use it instead of leaving them on the old credentials.
secretGenerator:
  - name: streamsense-secrets
    namespace: streamsense
    envs:
      - secrets/streamsense.env
