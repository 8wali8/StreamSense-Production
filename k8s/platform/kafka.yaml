apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: streamsense
spec:
  selector:
    app: kafka
  ports:
    - name: kafka
      port: 9092
      targetPort: 9092
---
# Headless service for the StatefulSet: gives the broker a stable DNS name for the KRaft quorum.
apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
  namespace: streamsense
spec:
  clusterIP: None
  selector:
    app: kafka
  ports:
    - name: kafka
      port: 9092
      targetPort: 9092
    - name: controller
      port: 29093
      targetPort: 29093
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: streamsense
spec:
  serviceName: kafka-headless
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      enableServiceLinks: false
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.6.1@sha256:620734d9fc0bb1f9886932e5baf33806074469f40e3fe246a3fdbb59309535fa
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              memory: 2Gi
          imagePullPolicy: IfNotPresent
          env:
            # Single-node KRaft: this broker is also the only controller. No ZooKeeper.
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 1@kafka-0.kafka-headless.streamsense.svc.cluster.local:29093
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: CLUSTER_ID
              value: HWde770keT-rHIYCTBoB4w
            - name: KAFKA_LOG_DIRS
              value: /var/lib/kafka/data
            - name: KAFKA_LISTENERS
              value: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093
            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://kafka:9092
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: PLAINTEXT
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "false"
          ports:
            - name: kafka
              containerPort: 9092
            - name: controller
              containerPort: 29093
          volumeMounts:
            - name: scratch-tmp
              mountPath: /tmp
            - name: scratch-etc-kafka
              mountPath: /etc/kafka
            - name: scratch-var-log-kafka
              mountPath: /var/log/kafka
            - name: kafka-data
              mountPath: /var/lib/kafka/data
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 40
            periodSeconds: 20
      volumes:
        - name: scratch-tmp
          emptyDir: {}
        - name: scratch-etc-kafka
          emptyDir: {}
        - name: scratch-var-log-kafka
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: kafka-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topics-init
  namespace: streamsense
spec:
  # Finished pods are garbage-collected; the topics themselves persist in Kafka.
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        # the network policy for the Job's pod selects on this label
        app: kafka-topics-init
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      restartPolicy: OnFailure
      containers:
        - name: kafka-topics-init
          image: confluentinc/cp-kafka:7.6.1@sha256:620734d9fc0bb1f9886932e5baf33806074469f40e3fe246a3fdbb59309535fa
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          imagePullPolicy: IfNotPresent
          command:
            - bash
            - -lc
            - >
              set -e;
              echo 'Waiting for Kafka...';
              for i in {1..60}; do
                kafka-topics --bootstrap-server kafka:9092 --list >/dev/null 2>&1 && break;
                sleep 2;
              done;
              echo 'Creating topics...';
              kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic stream.chat.messages --partitions 3 --replication-factor 1;
              kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic stream.chat.messages.dlt --partitions 3 --replication-factor 1;
              kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic stream.sentiment.events --partitions 3 --replication-factor 1;
              kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic stream.transcript.segments --partitions 3 --replication-factor 1;
              kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic stream.transcript.segments.dlt --partitions 3 --replication-factor 1;
              kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic stream.transcript.sentiment.events --partitions 3 --replication-factor 1;
              kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic stream.video.frames --partitions 3 --replication-factor 1;
              kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic stream.video.frames.dlt --partitions 3 --replication-factor 1;
              kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic stream.sponsor.detections --partitions 3 --replication-factor 1;
              kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic stream.chat.messages.analytics.dlt --partitions 3 --replication-factor 1;
              kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic stream.sentiment.events.analytics.dlt --partitions 3 --replication-factor 1;
              kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic stream.transcript.sentiment.events.analytics.dlt --partitions 3 --replication-factor 1;
              kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic stream.sponsor.detections.analytics.dlt --partitions 3 --replication-factor 1;
              kafka-topics --bootstrap-server kafka:9092 --list;
          volumeMounts:
            - name: scratch-tmp
              mountPath: /tmp
      volumes:
        - name: scratch-tmp
          emptyDir: {}
