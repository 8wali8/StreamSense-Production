apiVersion: v1
kind: Service
metadata:
  name: config-server
  namespace: streamsense
spec:
  selector:
    app: config-server
  ports:
    - name: http
      port: 8888
      targetPort: 8888
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server
  namespace: streamsense
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-server
  template:
    metadata:
      labels:
        app: config-server
    spec:
      initContainers:
        - name: wait-for-eureka
          image: busybox:1.36.1@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          command:
            - sh
            - -c
            - until wget -qO- http://eureka-server:8761/actuator/health; do sleep 2; done
      containers:
        - name: config-server
          image: streamsense/config-server:sprint9
          imagePullPolicy: IfNotPresent
          env:
            - name: CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS
              value: file:/config-repo
          ports:
            - containerPort: 8888
          volumeMounts:
            - name: config-server-repo
              mountPath: /config-repo
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8888
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8888
            initialDelaySeconds: 40
            periodSeconds: 20
            timeoutSeconds: 5
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8888
            failureThreshold: 60
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: config-server-repo
          configMap:
            name: config-server-native-repo
