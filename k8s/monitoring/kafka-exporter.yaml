apiVersion: v1
kind: Service
metadata:
  name: kafka-exporter
  namespace: streamsense
spec:
  selector:
    app: kafka-exporter
  ports:
    - name: metrics
      port: 9308
      targetPort: 9308
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-exporter
  namespace: streamsense
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-exporter
  template:
    metadata:
      labels:
        app: kafka-exporter
    spec:
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.36.1@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          command:
            - sh
            - -c
            - until nc -z kafka 9092; do sleep 2; done
      containers:
        - name: kafka-exporter
          image: danielqsj/kafka-exporter:v1.9.0@sha256:4150e46b2e9697ac30e4be8de03ec1704b4bdc7037577b83b8d35a32be298c16
          imagePullPolicy: IfNotPresent
          args:
            - --kafka.server=kafka:9092
            - --web.listen-address=:9308
          ports:
            - containerPort: 9308
          readinessProbe:
            httpGet:
              path: /metrics
              port: 9308
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /metrics
              port: 9308
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
