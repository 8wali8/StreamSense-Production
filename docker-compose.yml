services:
  eureka-server:
    build: ./eureka-server
    ports:
    - "8761:8761" #default port for eureka server

    #debugging since api-gateway is not showing up on eureka, may be because of diff startup timing
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8761/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  config-server:
    build: ./config-server
    ports:
      - "8888:8888" # port for config server
    volumes:
      - ./config-server/config-repo:/config-repo
    environment:
      - SPRING_PROFILES_ACTIVE=native
      - SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS=file:/config-repo
    depends_on:
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8888/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  api-gateway:
    build: ./api-gateway
    ports:
      - "8080:8080" # port for api-gateway
    environment:
      - STREAMSENSE_GATEWAY_AUTH_ENABLED=${STREAMSENSE_GATEWAY_AUTH_ENABLED:-false}
      - STREAMSENSE_GATEWAY_RATE_LIMIT_ENABLED=${STREAMSENSE_GATEWAY_RATE_LIMIT_ENABLED:-true}
      - STREAMSENSE_GATEWAY_TRUSTED_PROXY_HOPS=${STREAMSENSE_GATEWAY_TRUSTED_PROXY_HOPS:-0}
    secrets:
      - STREAMSENSE_GATEWAY_AUTH_HMAC_SECRET
    depends_on:
      eureka-server:
        condition: service_healthy
      redis:
        condition: service_healthy
      config-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-topics-init:
        condition: service_completed_successfully
      recommendation-service:
        condition: service_healthy
      sentiment-service:
        condition: service_healthy
      video-service:
        condition: service_healthy
      video-capture-service:
        condition: service_healthy
      analytics-service:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
  
  chat-service:
    build: ./chat-service
    ports: 
    - "8081:8081" # port for chat-service following pattern
    environment:
      - STREAMSENSE_TWITCH_CHAT_ENABLED=${STREAMSENSE_TWITCH_CHAT_ENABLED:-false}
      - TWITCH_CHAT_HOST=${TWITCH_CHAT_HOST:-irc.chat.twitch.tv}
      - TWITCH_CHAT_PORT=${TWITCH_CHAT_PORT:-6697}
      - TWITCH_CHAT_SSL=${TWITCH_CHAT_SSL:-true}
      - TWITCH_CHAT_USERNAME=${TWITCH_CHAT_USERNAME:-}
      - TWITCH_CHAT_OAUTH_TOKEN=${TWITCH_CHAT_OAUTH_TOKEN:-}
      - TWITCH_CHANNELS=${TWITCH_CHANNELS:-}
      - TWITCH_CHAT_RECONNECT_DELAY_MS=${TWITCH_CHAT_RECONNECT_DELAY_MS:-5000}
      - TWITCH_CHAT_MAX_RECONNECT_DELAY_MS=${TWITCH_CHAT_MAX_RECONNECT_DELAY_MS:-60000}
      - TWITCH_CHAT_CONNECTION_TIMEOUT_MS=${TWITCH_CHAT_CONNECTION_TIMEOUT_MS:-10000}
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-topics-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
  
  recommendation-service:
    build: ./recommendation-service
    ports:
    - "8082:8082" # following port pattern
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
  
  sentiment-service:
    build: ./sentiment-service
    ports:
    - "8083:8083"
    secrets:
      - POSTGRES_PASSWORD
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-topics-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  video-service:
    build: ./video-service
    ports:
    - "8084:8084"
    secrets:
      - POSTGRES_PASSWORD
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-topics-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  video-capture-service:
    build: ./video-capture-service
    ports:
      - "8090:8090"
    environment:
      STREAMSENSE_TWITCH_VIDEO_ENABLED: ${STREAMSENSE_TWITCH_VIDEO_ENABLED:-true}
      TWITCH_VIDEO_CHANNELS: ${TWITCH_VIDEO_CHANNELS:-}
      TWITCH_VIDEO_QUALITY: ${TWITCH_VIDEO_QUALITY:-best}
      TWITCH_VIDEO_SAMPLE_INTERVAL_SECONDS: ${TWITCH_VIDEO_SAMPLE_INTERVAL_SECONDS:-10}
      TWITCH_VIDEO_STREAM_RESOLVE_TIMEOUT_SECONDS: ${TWITCH_VIDEO_STREAM_RESOLVE_TIMEOUT_SECONDS:-20}
      TWITCH_VIDEO_FRAME_CAPTURE_TIMEOUT_SECONDS: ${TWITCH_VIDEO_FRAME_CAPTURE_TIMEOUT_SECONDS:-15}
      TWITCH_VIDEO_OAUTH_TOKEN: ${TWITCH_VIDEO_OAUTH_TOKEN:-}
      STREAMSENSE_REPLAY_ALIASES: ${STREAMSENSE_REPLAY_ALIASES:-redbull-testing}
      STREAMSENSE_REPLAY_REDBULL_TESTING_PROVIDER: twitch
      STREAMSENSE_REPLAY_REDBULL_TESTING_VOD_ID: "2750461300"
      STREAMSENSE_REPLAY_REDBULL_TESTING_VOD_URL: https://www.twitch.tv/videos/2750461300
      STREAMSENSE_REPLAY_REDBULL_TESTING_REPLAY_SPEED: "1.0"
      STREAMSENSE_REPLAY_REDBULL_TESTING_START_OFFSET_SECONDS: "1800"
      STREAMSENSE_REPLAY_REDBULL_TESTING_SOURCE: TWITCH_VOD_REPLAY
      STREAMSENSE_REPLAY_REDBULL_TESTING_LOOP: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      STREAMSENSE_VIDEO_FRAMES_TOPIC: stream.video.frames
      STREAMSENSE_TWITCH_TRANSCRIPT_ENABLED: ${STREAMSENSE_TWITCH_TRANSCRIPT_ENABLED:-false}
      STREAMSENSE_TRANSCRIPT_SEGMENTS_TOPIC: stream.transcript.segments
      TWITCH_TRANSCRIPT_SEGMENT_SECONDS: ${TWITCH_TRANSCRIPT_SEGMENT_SECONDS:-10}
      TWITCH_TRANSCRIPT_AUDIO_CAPTURE_TIMEOUT_SECONDS: ${TWITCH_TRANSCRIPT_AUDIO_CAPTURE_TIMEOUT_SECONDS:-30}
      TWITCH_TRANSCRIPT_REQUEST_TIMEOUT_SECONDS: ${TWITCH_TRANSCRIPT_REQUEST_TIMEOUT_SECONDS:-60}
      TWITCH_TRANSCRIPT_LANGUAGE: ${TWITCH_TRANSCRIPT_LANGUAGE:-en}
      STREAMSENSE_TRANSCRIPT_TEXT_MAX_CHARS: ${STREAMSENSE_TRANSCRIPT_TEXT_MAX_CHARS:-4000}
      STREAMSENSE_TRANSCRIPT_PREVIEW_CHARS: ${STREAMSENSE_TRANSCRIPT_PREVIEW_CHARS:-160}
      ML_ENGINE_URL: http://ml-engine:8000
      STREAMSENSE_FRAME_STORAGE_BACKEND: ${STREAMSENSE_FRAME_STORAGE_BACKEND:-s3}
      STREAMSENSE_FRAME_STORAGE_BUCKET: ${STREAMSENSE_FRAME_STORAGE_BUCKET:-streamsense-frames}
      STREAMSENSE_FRAME_STORAGE_ENDPOINT: ${STREAMSENSE_FRAME_STORAGE_ENDPOINT:-http://minio:9000}
      STREAMSENSE_FRAME_STORAGE_ACCESS_KEY_FILE: /run/secrets/STREAMSENSE_FRAME_STORAGE_ACCESS_KEY
      STREAMSENSE_FRAME_STORAGE_SECRET_KEY_FILE: /run/secrets/STREAMSENSE_FRAME_STORAGE_SECRET_KEY
    secrets:
      - STREAMSENSE_FRAME_STORAGE_ACCESS_KEY
      - STREAMSENSE_FRAME_STORAGE_SECRET_KEY
    depends_on:
      kafka:
        condition: service_healthy
      kafka-topics-init:
        condition: service_completed_successfully
      minio:
        condition: service_started
      ml-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/ready').read()"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  analytics-service:
    build: ./analytics-service
    ports:
      - "8085:8085"
    secrets:
      - POSTGRES_PASSWORD
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-topics-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  prometheus:
    image: prom/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:13.2.1@sha256:f772d434e8fab0049deb2b1b30abd43342bcfca1537614aa8d36080232cf4283
    ports:
      - "3001:3000" # so it doesn't collide with frontend at 3000:3000
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/GRAFANA_ADMIN_PASSWORD
    secrets:
      - GRAFANA_ADMIN_PASSWORD
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus

  zipkin:
    image: openzipkin/zipkin:3.6.1@sha256:d17e856dcbba7ffeefbbfc252f89ab78a4ab6faed47e646d46daad78f91b5ee2
    ports:
      - "9411:9411"
  
  kafka:
    image: confluentinc/cp-kafka:7.6.1@sha256:620734d9fc0bb1f9886932e5baf33806074469f40e3fe246a3fdbb59309535fa
    ports:
      # Host access (recommended)
      - "29092:29092"
      # Optional: also expose internal port (not required)
      # - "9092:9092"
    environment:
      # Single-node KRaft: this broker is also the only controller. No ZooKeeper (Kafka 4 removed it).
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: HWde770keT-rHIYCTBoB4w
      KAFKA_LOG_DIRS: /var/lib/kafka/data

      # Listeners:
      # - INTERNAL for other containers: kafka:9092
      # - EXTERNAL for your host machine: localhost:29092
      # - CONTROLLER for the KRaft quorum (never advertised)
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # Single-node convenience
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      # (Optional but helps with dev)
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2@sha256:8f2ff02d64b0a7a2b71b6b3b3148b85f66d00ec20ad40c30bdcd415d46d31818
    depends_on:
      - kafka
    ports:
      - "8088:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
  
  kafka-topics-init:
    image: confluentinc/cp-kafka:7.6.1@sha256:620734d9fc0bb1f9886932e5baf33806074469f40e3fe246a3fdbb59309535fa
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    command: >
      bash -lc "
        set -e;
        echo 'Waiting for Kafka...';
        for i in {1..60}; do
          kafka-topics --bootstrap-server kafka:9092 --list >/dev/null 2>&1 && break;
          sleep 2;
        done;
        echo 'Creating topics...';
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic stream.chat.messages --partitions 3 --replication-factor 1;
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic stream.chat.messages.dlt --partitions 3 --replication-factor 1;
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic stream.sentiment.events --partitions 3 --replication-factor 1;
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic stream.transcript.segments --partitions 3 --replication-factor 1;
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic stream.transcript.segments.dlt --partitions 3 --replication-factor 1;
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic stream.transcript.sentiment.events --partitions 3 --replication-factor 1;
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic stream.video.frames --partitions 3 --replication-factor 1;
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic stream.video.frames.dlt --partitions 3 --replication-factor 1;
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic stream.sponsor.detections --partitions 3 --replication-factor 1;
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic stream.chat.messages.analytics.dlt --partitions 3 --replication-factor 1;
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic stream.sentiment.events.analytics.dlt --partitions 3 --replication-factor 1;
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic stream.transcript.sentiment.events.analytics.dlt --partitions 3 --replication-factor 1;
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic stream.sponsor.detections.analytics.dlt --partitions 3 --replication-factor 1;
        echo 'Topics now:';
        kafka-topics --bootstrap-server kafka:9092 --list;
        echo 'Done.';
      "

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0@sha256:4150e46b2e9697ac30e4be8de03ec1704b4bdc7037577b83b8d35a32be298c16
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "9308:9308"
    command:
      - --kafka.server=kafka:9092
      - --web.listen-address=:9308
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9308/metrics >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:8080"
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    
  postgres:
    image: postgres:16.15@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: streamsense
      POSTGRES_USER: streamsense
      POSTGRES_PASSWORD_FILE: /run/secrets/POSTGRES_PASSWORD
    secrets:
      - POSTGRES_PASSWORD
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamsense -d streamsense"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7.4.11-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/STREAMSENSE_FRAME_STORAGE_ACCESS_KEY
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/STREAMSENSE_FRAME_STORAGE_SECRET_KEY
    secrets:
      - STREAMSENSE_FRAME_STORAGE_ACCESS_KEY
      - STREAMSENSE_FRAME_STORAGE_SECRET_KEY
    volumes:
      - minio-data:/data

  ml-engine:
    build: ./ml-engine
    ports:
      - "8000:8000"
    environment:
      ML_ENGINE_FORCE_FAILURE: ${ML_ENGINE_FORCE_FAILURE:-false}
      STREAMSENSE_FRAME_STORAGE_ENDPOINT: ${STREAMSENSE_FRAME_STORAGE_ENDPOINT:-http://minio:9000}
      STREAMSENSE_FRAME_STORAGE_REGION: ${STREAMSENSE_FRAME_STORAGE_REGION:-us-east-1}
      STREAMSENSE_FRAME_STORAGE_ACCESS_KEY_FILE: /run/secrets/STREAMSENSE_FRAME_STORAGE_ACCESS_KEY
      STREAMSENSE_FRAME_STORAGE_SECRET_KEY_FILE: /run/secrets/STREAMSENSE_FRAME_STORAGE_SECRET_KEY
      STREAMSENSE_SPONSOR_REQUIRE_FRAME_READ: ${STREAMSENSE_SPONSOR_REQUIRE_FRAME_READ:-false}
      STREAMSENSE_SEGMENTATION_BACKEND: ${STREAMSENSE_SEGMENTATION_BACKEND:-sam}
      STREAMSENSE_SEGMENTATION_MAX_PROPOSALS: ${STREAMSENSE_SEGMENTATION_MAX_PROPOSALS:-20}
      STREAMSENSE_SEGMENTATION_CONFIDENCE_THRESHOLD: ${STREAMSENSE_SEGMENTATION_CONFIDENCE_THRESHOLD:-0.88}
      STREAMSENSE_SPONSOR_SEGMENTATION_ENABLED: ${STREAMSENSE_SPONSOR_SEGMENTATION_ENABLED:-false}
      STREAMSENSE_SAM_MODEL_TYPE: ${STREAMSENSE_SAM_MODEL_TYPE:-vit_b}
      STREAMSENSE_SAM_DEVICE: ${STREAMSENSE_SAM_DEVICE:-cpu}
      STREAMSENSE_SAM_CACHE_DIR: /models/sam
      STREAMSENSE_SAM_AUTO_DOWNLOAD: ${STREAMSENSE_SAM_AUTO_DOWNLOAD:-true}
      STREAMSENSE_SAM_POINTS_PER_SIDE: ${STREAMSENSE_SAM_POINTS_PER_SIDE:-16}
      STREAMSENSE_WHISPER_MODEL: ${STREAMSENSE_WHISPER_MODEL:-small.en}
      STREAMSENSE_WHISPER_COMPUTE_TYPE: ${STREAMSENSE_WHISPER_COMPUTE_TYPE:-int8}
      STREAMSENSE_WHISPER_DEVICE: ${STREAMSENSE_WHISPER_DEVICE:-cpu}
      STREAMSENSE_WHISPER_LANGUAGE: ${STREAMSENSE_WHISPER_LANGUAGE:-en}
      STREAMSENSE_WHISPER_MODEL_CACHE: /models/whisper
      STREAMSENSE_SENTIMENT_BACKEND: ${STREAMSENSE_SENTIMENT_BACKEND:-transformers}
      STREAMSENSE_SENTIMENT_MODEL: ${STREAMSENSE_SENTIMENT_MODEL:-cardiffnlp/twitter-roberta-base-sentiment-latest}
      STREAMSENSE_SENTIMENT_DEVICE: ${STREAMSENSE_SENTIMENT_DEVICE:-cpu}
      STREAMSENSE_SENTIMENT_CACHE_DIR: /models/sentiment
      STREAMSENSE_SENTIMENT_MAX_CHARS: ${STREAMSENSE_SENTIMENT_MAX_CHARS:-1000}
      STREAMSENSE_SENTIMENT_PRELOAD: ${STREAMSENSE_SENTIMENT_PRELOAD:-false}
      STREAMSENSE_RELEVANCE_BACKEND: ${STREAMSENSE_RELEVANCE_BACKEND:-sentence-transformers}
      STREAMSENSE_RELEVANCE_MODEL: ${STREAMSENSE_RELEVANCE_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      STREAMSENSE_RELEVANCE_DEVICE: ${STREAMSENSE_RELEVANCE_DEVICE:-cpu}
      STREAMSENSE_RELEVANCE_CACHE_DIR: /models/relevance
      STREAMSENSE_RELEVANCE_MIN_SCORE: ${STREAMSENSE_RELEVANCE_MIN_SCORE:-0.50}
      STREAMSENSE_RELEVANCE_PRELOAD: ${STREAMSENSE_RELEVANCE_PRELOAD:-false}
    secrets:
      - STREAMSENSE_FRAME_STORAGE_ACCESS_KEY
      - STREAMSENSE_FRAME_STORAGE_SECRET_KEY
    volumes:
      - whisper-models:/models/whisper
      - sam-models:/models/sam
      - sentiment-models:/models/sentiment
      - relevance-models:/models/relevance
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ml/ready').read()"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

# Local credentials live in ./secrets/<NAME> (git-ignored). Run `make secrets` to create
# them from the committed *.example files. Containers read them from /run/secrets/<NAME>.
secrets:
  POSTGRES_PASSWORD:
    file: ./secrets/POSTGRES_PASSWORD
  STREAMSENSE_FRAME_STORAGE_ACCESS_KEY:
    file: ./secrets/STREAMSENSE_FRAME_STORAGE_ACCESS_KEY
  STREAMSENSE_FRAME_STORAGE_SECRET_KEY:
    file: ./secrets/STREAMSENSE_FRAME_STORAGE_SECRET_KEY
  GRAFANA_ADMIN_PASSWORD:
    file: ./secrets/GRAFANA_ADMIN_PASSWORD
  STREAMSENSE_GATEWAY_AUTH_HMAC_SECRET:
    file: ./secrets/STREAMSENSE_GATEWAY_AUTH_HMAC_SECRET

volumes:
  postgres-data:
  kafka-data:
  minio-data:
  whisper-models:
  sam-models:
  sentiment-models:
  relevance-models:
