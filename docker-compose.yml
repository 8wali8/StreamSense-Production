services:
  eureka-server:
    build: ./eureka-server
    ports:
    - "8761:8761" #default port for eureka server

    #debugging since api-gateway is not showing up on eureka, may be because of diff startup timing
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8761/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  config-server:
    build: ./config-server
    ports:
      - "8888:8888" # port for config server
    volumes:
      - ./config-server/config-repo:/config-repo
    environment:
      - SPRING_PROFILES_ACTIVE=native
      - SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS=file:/config-repo
    depends_on:
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8888/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  api-gateway:
    build: ./api-gateway
    ports:
      - "8080:8080" # port for api-gateway
    environment:
      - STREAMSENSE_GATEWAY_AUTH_ENABLED=${STREAMSENSE_GATEWAY_AUTH_ENABLED:-false}
      - STREAMSENSE_GATEWAY_RATE_LIMIT_ENABLED=${STREAMSENSE_GATEWAY_RATE_LIMIT_ENABLED:-true}
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-topics-init:
        condition: service_completed_successfully
      recommendation-service:
        condition: service_healthy
      sentiment-service:
        condition: service_healthy
      video-service:
        condition: service_healthy
      video-capture-service:
        condition: service_healthy
      analytics-service:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
  
  chat-service:
    build: ./chat-service
    ports: 
    - "8081:8081" # port for chat-service following pattern
    environment:
      - STREAMSENSE_TWITCH_CHAT_ENABLED=${STREAMSENSE_TWITCH_CHAT_ENABLED:-false}
      - TWITCH_CHAT_HOST=${TWITCH_CHAT_HOST:-irc.chat.twitch.tv}
      - TWITCH_CHAT_PORT=${TWITCH_CHAT_PORT:-6697}
      - TWITCH_CHAT_SSL=${TWITCH_CHAT_SSL:-true}
      - TWITCH_CHAT_USERNAME=${TWITCH_CHAT_USERNAME:-}
      - TWITCH_CHAT_OAUTH_TOKEN=${TWITCH_CHAT_OAUTH_TOKEN:-}
      - TWITCH_CHANNELS=${TWITCH_CHANNELS:-}
      - TWITCH_CHAT_RECONNECT_DELAY_MS=${TWITCH_CHAT_RECONNECT_DELAY_MS:-5000}
      - TWITCH_CHAT_MAX_RECONNECT_DELAY_MS=${TWITCH_CHAT_MAX_RECONNECT_DELAY_MS:-60000}
      - TWITCH_CHAT_CONNECTION_TIMEOUT_MS=${TWITCH_CHAT_CONNECTION_TIMEOUT_MS:-10000}
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-topics-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
  
  recommendation-service:
    build: ./recommendation-service
    ports:
    - "8082:8082" # following port pattern
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
  
  sentiment-service:
    build: ./sentiment-service
    ports:
    - "8083:8083"
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-topics-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  video-service:
    build: ./video-service
    ports:
    - "8084:8084"
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-topics-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  video-capture-service:
    build: ./video-capture-service
    ports:
      - "8090:8090"
    environment:
      STREAMSENSE_TWITCH_VIDEO_ENABLED: ${STREAMSENSE_TWITCH_VIDEO_ENABLED:-false}
      TWITCH_VIDEO_CHANNELS: ${TWITCH_VIDEO_CHANNELS:-}
      TWITCH_VIDEO_QUALITY: ${TWITCH_VIDEO_QUALITY:-best}
      TWITCH_VIDEO_SAMPLE_INTERVAL_SECONDS: ${TWITCH_VIDEO_SAMPLE_INTERVAL_SECONDS:-10}
      TWITCH_VIDEO_STREAM_RESOLVE_TIMEOUT_SECONDS: ${TWITCH_VIDEO_STREAM_RESOLVE_TIMEOUT_SECONDS:-20}
      TWITCH_VIDEO_FRAME_CAPTURE_TIMEOUT_SECONDS: ${TWITCH_VIDEO_FRAME_CAPTURE_TIMEOUT_SECONDS:-15}
      TWITCH_VIDEO_OAUTH_TOKEN: ${TWITCH_VIDEO_OAUTH_TOKEN:-}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      STREAMSENSE_VIDEO_FRAMES_TOPIC: stream.video.frames
      STREAMSENSE_TWITCH_TRANSCRIPT_ENABLED: ${STREAMSENSE_TWITCH_TRANSCRIPT_ENABLED:-false}
      STREAMSENSE_TRANSCRIPT_SEGMENTS_TOPIC: stream.transcript.segments
      TWITCH_TRANSCRIPT_SEGMENT_SECONDS: ${TWITCH_TRANSCRIPT_SEGMENT_SECONDS:-10}
      TWITCH_TRANSCRIPT_AUDIO_CAPTURE_TIMEOUT_SECONDS: ${TWITCH_TRANSCRIPT_AUDIO_CAPTURE_TIMEOUT_SECONDS:-30}
      TWITCH_TRANSCRIPT_REQUEST_TIMEOUT_SECONDS: ${TWITCH_TRANSCRIPT_REQUEST_TIMEOUT_SECONDS:-60}
      TWITCH_TRANSCRIPT_LANGUAGE: ${TWITCH_TRANSCRIPT_LANGUAGE:-en}
      STREAMSENSE_TRANSCRIPT_TEXT_MAX_CHARS: ${STREAMSENSE_TRANSCRIPT_TEXT_MAX_CHARS:-4000}
      STREAMSENSE_TRANSCRIPT_PREVIEW_CHARS: ${STREAMSENSE_TRANSCRIPT_PREVIEW_CHARS:-160}
      ML_ENGINE_URL: http://ml-engine:8000
      STREAMSENSE_FRAME_STORAGE_BACKEND: ${STREAMSENSE_FRAME_STORAGE_BACKEND:-s3}
      STREAMSENSE_FRAME_STORAGE_BUCKET: ${STREAMSENSE_FRAME_STORAGE_BUCKET:-streamsense-frames}
      STREAMSENSE_FRAME_STORAGE_ENDPOINT: ${STREAMSENSE_FRAME_STORAGE_ENDPOINT:-http://minio:9000}
      STREAMSENSE_FRAME_STORAGE_ACCESS_KEY: ${STREAMSENSE_FRAME_STORAGE_ACCESS_KEY:-streamsense}
      STREAMSENSE_FRAME_STORAGE_SECRET_KEY: ${STREAMSENSE_FRAME_STORAGE_SECRET_KEY:-streamsense}
    depends_on:
      kafka:
        condition: service_healthy
      kafka-topics-init:
        condition: service_completed_successfully
      minio:
        condition: service_started
      ml-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health').read()"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  analytics-service:
    build: ./analytics-service
    ports:
      - "8085:8085"
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-topics-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000" # so it doesn't collide with frontend at 3000:3000
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus

  zipkin:
    image: openzipkin/zipkin:latest
    ports:
      - "9411:9411"
  
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
  
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      - zookeeper
    ports:
      # Host access (recommended)
      - "29092:29092"
      # Optional: also expose internal port (not required)
      # - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      # Two listeners:
      # - INTERNAL for other containers: kafka:9092
      # - EXTERNAL for your host machine: localhost:29092
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # Single-node convenience
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      # (Optional but helps with dev)
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on:
      - kafka
    ports:
      - "8088:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
  
  kafka-topics-init:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    command: >
      bash -lc "
        set -e;
        echo 'Waiting for Kafka...';
        for i in {1..60}; do
          kafka-topics --bootstrap-server kafka:9092 --list >/dev/null 2>&1 && break;
          sleep 2;
        done;
        echo 'Creating topics...';
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic stream.chat.messages --partitions 3 --replication-factor 1;
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic stream.chat.messages.dlt --partitions 3 --replication-factor 1;
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic stream.sentiment.events --partitions 3 --replication-factor 1;
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic stream.transcript.segments --partitions 3 --replication-factor 1;
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic stream.transcript.segments.dlt --partitions 3 --replication-factor 1;
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic stream.transcript.sentiment.events --partitions 3 --replication-factor 1;
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic stream.video.frames --partitions 3 --replication-factor 1;
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic stream.sponsor.detections --partitions 3 --replication-factor 1;
        echo 'Topics now:';
        kafka-topics --bootstrap-server kafka:9092 --list;
        echo 'Done.';
      "

  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "9308:9308"
    command:
      - --kafka.server=kafka:9092
      - --web.listen-address=:9308
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9308/metrics >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:80"
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    
  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: streamsense
      POSTGRES_USER: streamsense
      POSTGRES_PASSWORD: streamsense
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamsense -d streamsense"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${STREAMSENSE_FRAME_STORAGE_ACCESS_KEY:-streamsense}
      MINIO_ROOT_PASSWORD: ${STREAMSENSE_FRAME_STORAGE_SECRET_KEY:-streamsense}
    volumes:
      - minio-data:/data

  ml-engine:
    build: ./ml-engine
    ports:
      - "8000:8000"
    environment:
      ML_ENGINE_FORCE_FAILURE: ${ML_ENGINE_FORCE_FAILURE:-false}
      STREAMSENSE_FRAME_STORAGE_ENDPOINT: ${STREAMSENSE_FRAME_STORAGE_ENDPOINT:-http://minio:9000}
      STREAMSENSE_FRAME_STORAGE_REGION: ${STREAMSENSE_FRAME_STORAGE_REGION:-us-east-1}
      STREAMSENSE_FRAME_STORAGE_ACCESS_KEY: ${STREAMSENSE_FRAME_STORAGE_ACCESS_KEY:-streamsense}
      STREAMSENSE_FRAME_STORAGE_SECRET_KEY: ${STREAMSENSE_FRAME_STORAGE_SECRET_KEY:-streamsense}
      STREAMSENSE_SPONSOR_REQUIRE_FRAME_READ: ${STREAMSENSE_SPONSOR_REQUIRE_FRAME_READ:-false}
      STREAMSENSE_WHISPER_MODEL: ${STREAMSENSE_WHISPER_MODEL:-small.en}
      STREAMSENSE_WHISPER_COMPUTE_TYPE: ${STREAMSENSE_WHISPER_COMPUTE_TYPE:-int8}
      STREAMSENSE_WHISPER_DEVICE: ${STREAMSENSE_WHISPER_DEVICE:-cpu}
      STREAMSENSE_WHISPER_LANGUAGE: ${STREAMSENSE_WHISPER_LANGUAGE:-en}
      STREAMSENSE_WHISPER_MODEL_CACHE: /models/whisper
    volumes:
      - whisper-models:/models/whisper
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ml/health').read()"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  postgres-data:
  minio-data:
  whisper-models:
