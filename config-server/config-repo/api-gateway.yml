# config-server/config-repo/api-gateway.yml

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://eureka-server:8761/eureka}

streamsense:
  topics:
    chatMessages: stream.chat.messages
    sentimentEvents: stream.sentiment.events
    transcriptSegments: stream.transcript.segments
    transcriptSentimentEvents: stream.transcript.sentiment.events
    sponsorDetections: stream.sponsor.detections
  services:
    chat-service:
      base-url: http://chat-service:8081
    recommendation-service:
      base-url: http://recommendation-service:8082
    sentiment-service:
      base-url: http://sentiment-service:8083
    video-service:
      base-url: http://video-service:8084
    video-capture-service:
      base-url: http://video-capture-service:8090
    analytics-service:
      base-url: http://analytics-service:8085
    ml-engine:
      base-url: http://ml-engine:8000
    # WebClient calls from GraphQL resolvers; proxied routes use spring.cloud.gateway.server.webflux.httpclient below.
    connect-timeout: 2s
    response-timeout: 5s
  gateway:
    rate-limit-enabled: ${STREAMSENSE_GATEWAY_RATE_LIMIT_ENABLED:true}
    # Counters are shared across gateway replicas through Redis; "memory" counts per instance.
    rate-limit-store: ${STREAMSENSE_GATEWAY_RATE_LIMIT_STORE:redis}
    # If Redis is unreachable, requests pass (true) rather than being rejected; the outage is metered.
    rate-limit-fail-open: ${STREAMSENSE_GATEWAY_RATE_LIMIT_FAIL_OPEN:true}
    trusted-proxy-hops: ${STREAMSENSE_GATEWAY_TRUSTED_PROXY_HOPS:0}
    auth:
      enabled: ${STREAMSENSE_GATEWAY_AUTH_ENABLED:false}
      required-issuer: streamsense-local
      required-audience: streamsense-clients
      hmac-secret: ${STREAMSENSE_GATEWAY_AUTH_HMAC_SECRET:}
      protected-paths:
        - /graphql
        - /api/**
        - /ml/**
      excluded-paths:
        - /actuator/**
        - /graphiql
        - /graphiql/**
    rate-limits:
      - id: chat-ingest
        path: /api/chat/ingest
        method: POST
        requests: 30
        window-seconds: 60
      - id: video-upload
        path: /api/video/upload-frame
        method: POST
        requests: 20
        window-seconds: 60
      # The console's segmentation preview; segmentation is the most expensive call ml-engine serves.
      - id: ml-segment
        path: /ml/segment
        method: POST
        requests: 30
        window-seconds: 60

spring:
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      # Short budgets: a slow Redis must not hold every rate-limited request.
      connect-timeout: 500ms
      timeout: 500ms
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    consumer:
      group-id: api-gateway-subscriptions
      client-id: api-gateway-subscriptions
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        partition.assignment.strategy: org.apache.kafka.clients.consumer.CooperativeStickyAssignor
        spring.json.trusted.packages: com.streamsense.apigateway.events
        spring.json.value.default.type: com.streamsense.apigateway.events.ChatMessageEvent
        spring.json.use.type.headers: false

  cloud:
    gateway:
      server:
        webflux:
          metrics:
            enabled: true
          httpclient:
            connect-timeout: 2000
            response-timeout: 10s
          routes:
            - id: chat-service-api
              uri: ${streamsense.services.chat-service.base-url}
              predicates:
                - Path=/api/chat/**
            - id: sentiment-service-api
              uri: ${streamsense.services.sentiment-service.base-url}
              predicates:
                - Path=/api/sentiment/**
            - id: recommendation-service-api
              uri: ${streamsense.services.recommendation-service.base-url}
              predicates:
                - Path=/api/recommendations/**
            - id: video-capture-service-api
              uri: ${streamsense.services.video-capture-service.base-url}
              predicates:
                - Path=/api/video/capture/**
            - id: video-service-api
              uri: ${streamsense.services.video-service.base-url}
              predicates:
                - Path=/api/video/**
            - id: analytics-service-api
              uri: ${streamsense.services.analytics-service.base-url}
              predicates:
                - Path=/api/analytics/**
            # The one ml-engine endpoint the console calls. It goes through the gateway so the auth and
            # rate-limit filters cover it; every other ml-engine route stays internal to the services.
            - id: ml-engine-segment
              uri: ${streamsense.services.ml-engine.base-url}
              predicates:
                - Path=/ml/segment
                - Method=POST
              metadata:
                # The SAM backend's first call downloads and initialises the model; well above the 10 s default.
                response-timeout: 180000

  graphql:
    graphiql:
      # An interactive schema explorer is a local convenience, not a production endpoint.
      enabled: ${STREAMSENSE_GATEWAY_GRAPHIQL_ENABLED:false}
    websocket:
      path: /graphql
