# config-server/config-repo/chat-service.yml

server:
  port: 8081

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://eureka-server:8761/eureka}

streamsense:
  topics:
    chatMessages: stream.chat.messages
  twitch:
    chat:
      enabled: ${STREAMSENSE_TWITCH_CHAT_ENABLED:false}
      host: ${TWITCH_CHAT_HOST:irc.chat.twitch.tv}
      port: ${TWITCH_CHAT_PORT:6697}
      ssl: ${TWITCH_CHAT_SSL:true}
      username: ${TWITCH_CHAT_USERNAME:}
      oauth-token: ${TWITCH_CHAT_OAUTH_TOKEN:}
      channels: ${TWITCH_CHANNELS:}
      reconnect-delay-ms: ${TWITCH_CHAT_RECONNECT_DELAY_MS:5000}
      max-reconnect-delay-ms: ${TWITCH_CHAT_MAX_RECONNECT_DELAY_MS:60000}
      connection-timeout-ms: ${TWITCH_CHAT_CONNECTION_TIMEOUT_MS:10000}
  replay:
    aliases:
      redbull-testing:
        provider: twitch
        vod-id: "2750461300"
        vod-url: "https://www.twitch.tv/videos/2750461300"
        replay-speed: 1.0
        start-offset-seconds: 1800
        source: TWITCH_VOD_REPLAY
        loop: true
        chat-fixture-path: classpath:replay/redbull-testing-chat.json
    twitch-graphql:
      endpoint: ${TWITCH_GQL_ENDPOINT:https://gql.twitch.tv/gql}
      client-id: ${TWITCH_GQL_CLIENT_ID:kimne78kx3ncx6brgo4mv6wki5h1ko}
      request-timeout-ms: ${TWITCH_GQL_REQUEST_TIMEOUT_MS:10000}
      max-pages: ${TWITCH_GQL_MAX_PAGES:200}

spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
