server:
  port: 8085

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://eureka-server:8761/eureka}

streamsense:
  topics:
    chatMessages: stream.chat.messages
    chatMessagesDlt: stream.chat.messages.analytics.dlt
    sentimentEvents: stream.sentiment.events
    sentimentEventsDlt: stream.sentiment.events.analytics.dlt
    sponsorDetections: stream.sponsor.detections
    sponsorDetectionsDlt: stream.sponsor.detections.analytics.dlt
    transcriptSentimentEvents: stream.transcript.sentiment.events
    transcriptSentimentEventsDlt: stream.transcript.sentiment.events.analytics.dlt
  processing:
    retryBackoffMs: ${STREAMSENSE_ANALYTICS_RETRY_BACKOFF_MS:1000}
    maxRetries: ${STREAMSENSE_ANALYTICS_MAX_RETRIES:2}
  analytics:
    bucket-size-seconds: ${STREAMSENSE_ANALYTICS_BUCKET_SIZE_SECONDS:60}
    default-window-minutes: ${STREAMSENSE_ANALYTICS_DEFAULT_WINDOW_MINUTES:15}
    max-window-minutes: ${STREAMSENSE_ANALYTICS_MAX_WINDOW_MINUTES:1440}
    estimated-sponsor-exposure-ms-per-detection: ${STREAMSENSE_ANALYTICS_SPONSOR_EXPOSURE_MS_PER_DETECTION:10000}
    minimum-sponsor-confidence: ${STREAMSENSE_ANALYTICS_MINIMUM_SPONSOR_CONFIDENCE:0.50}
    negative-spike-ratio-threshold: ${STREAMSENSE_ANALYTICS_NEGATIVE_SPIKE_RATIO_THRESHOLD:0.60}
    negative-spike-minimum-events: ${STREAMSENSE_ANALYTICS_NEGATIVE_SPIKE_MINIMUM_EVENTS:10}
    engagement-spike-minimum-messages: ${STREAMSENSE_ANALYTICS_ENGAGEMENT_SPIKE_MINIMUM_MESSAGES:20}
    engagement-spike-multiplier: ${STREAMSENSE_ANALYTICS_ENGAGEMENT_SPIKE_MULTIPLIER:2.0}
    engagement-spike-trailing-window-minutes: ${STREAMSENSE_ANALYTICS_ENGAGEMENT_SPIKE_TRAILING_WINDOW_MINUTES:5}
    low-data-minimum-events: ${STREAMSENSE_ANALYTICS_LOW_DATA_MINIMUM_EVENTS:5}
    capture-session-idle-close-minutes: ${STREAMSENSE_ANALYTICS_CAPTURE_SESSION_IDLE_CLOSE_MINUTES:10}
    max-range-hours: ${STREAMSENSE_ANALYTICS_MAX_RANGE_HOURS:48}
    value:
      # Media value assumptions for the session report; a deal overrides them per request.
      cpm-per-30s-equivalent: ${STREAMSENSE_ANALYTICS_VALUE_CPM:12.0}
      host-read-rate-per-1000: ${STREAMSENSE_ANALYTICS_VALUE_HOST_READ_RATE:15.0}
      prominence-base: 0.5
      prominence-area-scale: 10.0
    response:
      # Counted when a request names no command or link host; empty means none.
      default-chat-command: ${STREAMSENSE_ANALYTICS_RESPONSE_CHAT_COMMAND:}
      default-tracked-link-host: ${STREAMSENSE_ANALYTICS_RESPONSE_LINK_HOST:}
  services:
    sentiment-service:
      # Creating a deal points relevance scoring at its sponsor for the channel; best effort, bounded.
      base-url: http://sentiment-service:8083
      connect-timeout-ms: 2000
      read-timeout-ms: 3000
    # A VOD import replays the recording's chat and its frames and audio through these two services.
    chat-service:
      base-url: http://chat-service:8081
      connect-timeout-ms: 2000
      read-timeout-ms: 5000
    video-capture-service:
      base-url: http://video-capture-service:8090
      connect-timeout-ms: 2000
      read-timeout-ms: 5000
  twitch:
    helix:
      # Live state, title, category, and viewer counts per watched channel; needs the TWITCH_CLIENT_ID
      # and TWITCH_CLIENT_SECRET secrets (configtree) of a registered Twitch application.
      enabled: ${STREAMSENSE_TWITCH_HELIX_ENABLED:false}
      client-id: ${TWITCH_CLIENT_ID:}
      client-secret: ${TWITCH_CLIENT_SECRET:}
      base-url: ${TWITCH_HELIX_BASE_URL:https://api.twitch.tv/helix}
      token-url: ${TWITCH_OAUTH_TOKEN_URL:https://id.twitch.tv/oauth2/token}
      poll-interval-ms: ${STREAMSENSE_TWITCH_HELIX_POLL_INTERVAL_MS:60000}
      initial-delay-ms: ${STREAMSENSE_TWITCH_HELIX_INITIAL_DELAY_MS:15000}
      # Comma-separated logins always polled; streamers with recent events are polled as well.
      channels: ${STREAMSENSE_TWITCH_HELIX_CHANNELS:}
      watch-streamers-seen-within-hours: ${STREAMSENSE_TWITCH_HELIX_WATCH_HOURS:24}
      # Generous: the container's first name lookup of api.twitch.tv can take seconds.
      connect-timeout-ms: 5000
      read-timeout-ms: 10000
      token-refresh-margin-seconds: 60

spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    consumer:
      group-id: analytics-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

  datasource:
    url: jdbc:postgresql://postgres:5432/streamsense
    username: streamsense
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    table: analytics_service_flyway_history
    baseline-on-migrate: true
    baseline-version: 0

management:
  endpoint:
    health:
      group:
        readiness:
          # Not ready until the datastore checks pass; liveness stays independent of them.
          include: readinessState,db
    prometheus:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
