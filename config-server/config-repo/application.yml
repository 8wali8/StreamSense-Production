server:
  # Stop accepting requests, let in-flight work and Kafka listeners finish, then exit.
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  # RFC 9457 problem+json for framework-raised errors (MVC services and the WebFlux gateway).
  mvc:
    problemdetails:
      enabled: true
  webflux:
    problemdetails:
      enabled: true

logging:
  # One JSON object per line (Elastic Common Schema); MDC keys such as correlationId and the
  # Micrometer traceId/spanId are included automatically. Set to an empty value for plain text.
  structured:
    format:
      console: ${STREAMSENSE_LOG_FORMAT:ecs}
  pattern:
    level: "%5p [traceId=%X{traceId:-}, spanId=%X{spanId:-}, correlationId=%X{correlationId:-}]"

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    prometheus:
      enabled: true
    health:
      # Exposes /actuator/health/liveness and /readiness for Kubernetes probes.
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans
