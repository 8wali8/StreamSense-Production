server:
  port: 8082

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://eureka-server:8761/eureka}

streamsense:
  services:
    sentiment-service:
      base-url: http://sentiment-service:8083
    video-service:
      base-url: http://video-service:8084
  recommendations:
    defaultLimit: 3
    maxLimit: 6
    signalWindowLimit: 20
    refreshMode: restart
    experimentName: recommendation-ranking-v1
    activeVariant: balanced
    variants:
      balanced:
        enabled: true
        positiveWeight: 1.0
        sponsorWeight: 0.9
        cautionWeight: 1.1
        momentumThreshold: 0.15
        sponsorConfidenceThreshold: 0.65
      sponsorBoost:
        enabled: true
        positiveWeight: 0.85
        sponsorWeight: 1.25
        cautionWeight: 1.0
        momentumThreshold: 0.10
        sponsorConfidenceThreshold: 0.55

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
