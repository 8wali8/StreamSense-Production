server:
  port: 8083

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://eureka-server:8761/eureka}

streamsense:
  topics:
    chatMessages: stream.chat.messages
    sentimentEvents: stream.sentiment.events
    chatMessagesDlt: stream.chat.messages.dlt
    transcriptSegments: stream.transcript.segments
    transcriptSentimentEvents: stream.transcript.sentiment.events
    transcriptSegmentsDlt: stream.transcript.segments.dlt
  ml:
    base-url: http://ml-engine:8000
    connectTimeoutMs: 2000
    readTimeoutMs: 10000
  history:
    defaultLimit: 20
    maxLimit: 100
  cache:
    recentPrefix: sentiment:recent
    recentTtlSeconds: 60
  processing:
    retryBackoffMs: 1000
    maxRetries: 2
  sentiment:
    relevance:
      enabled: true
      minScore: 0.50
      sponsors:
        - name: Nike
          aliases: [nike, swoosh, just do it]
          semanticTerms: [shoes, sneakers, kicks, running shoes, apparel, sportswear, trainers]
        - name: Prime
          aliases: [prime, prime hydration]
          semanticTerms: [hydration, drink, energy drink, bottle]
        - name: Razer
          aliases: [razer]
          semanticTerms: [keyboard, mouse, headset, gaming gear, peripherals]
        - name: Red Bull
          aliases: [red bull, redbull, rb]
          semanticTerms: [energy drink, energy, drink, can, wings, caffeine, extreme sports, f1, formula 1, racing]
      seeds:
        - streamer: redbull-testing
          sponsor: Red Bull

hystrix:
  command:
    mlSentiment:
      executionTimeoutMs: 3000
      requestVolumeThreshold: 10
      errorThresholdPercentage: 50
      sleepWindowMs: 15000
      maxConcurrentCalls: 4
      maxRetries: 2

spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    consumer:
      group-id: sentiment-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: com.streamsense.sentimentservice.events.ChatMessageEvent
        spring.json.use.type.headers: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  datasource:
    url: jdbc:postgresql://postgres:5432/streamsense
    username: streamsense
    password: streamsense
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

  data:
    redis:
      host: redis
      port: 6379
      repositories:
        enabled: false
      timeout: 2s

resilience4j:
  circuitbreaker:
    instances:
      mlSentiment:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 15s
        permittedNumberOfCallsInHalfOpenState: 2
        automaticTransitionFromOpenToHalfOpenEnabled: true
        recordExceptions:
          - com.streamsense.sentimentservice.client.MlDependencyException
  retry:
    instances:
      mlSentiment:
        maxAttempts: 3
        waitDuration: 1s
        retryExceptions:
          - com.streamsense.sentimentservice.client.MlDependencyException
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
          - io.github.resilience4j.bulkhead.BulkheadFullException
        ignoreExceptions:
          - java.lang.IllegalStateException
          - java.lang.IllegalArgumentException
  bulkhead:
    instances:
      mlSentiment:
        maxConcurrentCalls: 4
        maxWaitDuration: 0ms

management:
  health:
    circuitbreakers:
      enabled: true
