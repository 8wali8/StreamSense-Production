[project]
name = "streamsense-video-capture-service"
version = "0.1.0"
description = "StreamSense Twitch frame and audio capture: streamlink/ffmpeg sampling, MinIO frame storage, Kafka publishing, transcription requests"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2,<3",
    # kafka-python 3.x is the current line; the 2.x to 3.x jump had breaking changes, so the major is pinned.
    "kafka-python>=3.0,<4",
    "boto3>=1.34,<2",
    "prometheus-client>=0.20,<1",
    "streamlink>=7,<9",
    "requests>=2.31,<3",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "httpx>=0.27,<1",
    "ruff==0.16.3",
    "jsonschema>=4.26,<5",
]

[tool.uv]
# The service is run from src/main/python via PYTHONPATH, not installed as a package.
package = false
environments = ["sys_platform == 'linux'", "sys_platform == 'win32'"]

[tool.pytest.ini_options]
testpaths = ["src/test/python"]
pythonpath = ["src/main/python"]

[tool.ruff]
line-length = 120

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
# Broad excepts at the capture-loop and storage boundaries are replaced by typed
# exception handling in the lifecycle branch (hardening/06b); keep lint green until then.
"src/main/python/app/capture_loop.py" = ["BLE001"]
"src/main/python/app/storage.py" = ["BLE001"]
