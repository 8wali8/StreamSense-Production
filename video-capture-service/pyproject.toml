[project]
name = "streamsense-video-capture-service"
version = "0.1.0"
description = "StreamSense Twitch frame and audio capture: streamlink/ffmpeg sampling, MinIO frame storage, Kafka publishing, transcription requests"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2,<3",
    # kafka-python 3.x is the current line; the 2.x to 3.x jump had breaking changes, so the major is pinned.
    "kafka-python>=3.0,<4",
    "boto3>=1.34,<2",
    "prometheus-client>=0.20,<1",
    "streamlink>=7,<9",
    "requests>=2.31,<3",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/video_capture_service"]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "httpx>=0.27,<1",
    "ruff==0.16.3",
    "jsonschema>=4.26,<5",
    "mypy>=1.20,<2",
]

[tool.uv]
environments = ["sys_platform == 'linux'", "sys_platform == 'win32'"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# The rule families every module passes; add a family here only together with the fixes it needs.
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF", "PT", "BLE", "S", "N"]
# Event and API models keep the camelCase field names of the JSON contracts in docs/schemas.
ignore = ["N815"]

[tool.ruff.lint.isort]
known-first-party = ["video_capture_service"]

[tool.ruff.lint.per-file-ignores]
# Query parameters carry the API's camelCase names.
"src/video_capture_service/main.py" = ["N803"]
# Tests assert, carry placeholder credentials, and write under /tmp on purpose.
"tests/*" = ["S101", "S105", "S108"]
# Broad excepts at the capture-loop and storage boundaries are replaced by typed
# exception handling in the lifecycle branch (hardening/06b); keep lint green until then.
"src/video_capture_service/capture_loop.py" = ["BLE001"]
"src/video_capture_service/storage.py" = ["BLE001"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
