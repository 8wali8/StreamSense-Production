name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  java-build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        service:
          - eureka-server
          - config-server
          - api-gateway
          - chat-service
          - sentiment-service
          - video-service
          - recommendation-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test
        working-directory: ${{ matrix.service }}
        run: mvn -B -ntp clean test

  test-ml-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: ml-engine
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff

      - name: Run lint
        working-directory: ml-engine
        run: ruff check src/main/python src/test/python

      - name: Run tests
        working-directory: ml-engine
        env:
          PYTHONPATH: src/main/python
        run: pytest src/test/python

  frontend-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run lint
        working-directory: frontend
        run: npm run lint

      - name: Run tests
        working-directory: frontend
        run: npm run test

      - name: Run build
        working-directory: frontend
        run: npm run build

  docker-smoke:
    runs-on: ubuntu-latest
    needs:
      - java-build-test
      - test-ml-engine
      - frontend-checks

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Package Java services for Docker
        run: |
          mvn -B -ntp -f eureka-server/pom.xml -DskipTests package
          mvn -B -ntp -f config-server/pom.xml -DskipTests package
          mvn -B -ntp -f api-gateway/pom.xml -DskipTests package
          mvn -B -ntp -f chat-service/pom.xml -DskipTests package
          mvn -B -ntp -f sentiment-service/pom.xml -DskipTests package
          mvn -B -ntp -f video-service/pom.xml -DskipTests package

      - name: Validate docker compose config
        run: docker compose config

      - name: Build Sprint 6 smoke images
        run: docker compose build eureka-server config-server ml-engine sentiment-service chat-service video-service api-gateway

      - name: Start Sprint 6 smoke stack
        run: docker compose up -d zookeeper kafka kafka-topics-init postgres redis eureka-server config-server ml-engine sentiment-service chat-service video-service api-gateway

      - name: Wait for core services
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:8761/actuator/health >/dev/null && curl -fsS http://localhost:8888/actuator/health >/dev/null && curl -fsS http://localhost:8080/actuator/health >/dev/null && curl -fsS http://localhost:8081/actuator/health >/dev/null && curl -fsS http://localhost:8083/actuator/health >/dev/null && curl -fsS http://localhost:8084/actuator/health >/dev/null && curl -fsS http://localhost:8000/ml/health >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Verify Kafka topics exist
        run: |
          docker compose exec -T kafka kafka-topics --bootstrap-server kafka:9092 --list | grep -q '^stream.chat.messages$'
          docker compose exec -T kafka kafka-topics --bootstrap-server kafka:9092 --list | grep -q '^stream.sentiment.events$'

      - name: Verify Redis is reachable
        run: docker compose exec -T redis redis-cli ping | grep -q PONG

      - name: Verify chat ingest returns event id
        run: |
          curl -fsS -X POST http://localhost:8081/api/chat/ingest \
            -H 'Content-Type: application/json' \
            -d '{"streamer":"ci-test","user":"u1","message":"hello from ci","timestamp":1710000000000}' | grep -q '"eventId"'

      - name: Wait for recent sentiment history
        run: |
          for i in {1..60}; do
            if curl -fsS "http://localhost:8083/api/sentiment/recent?streamer=ci-test&limit=1" | grep -q '"sentimentEventId"'; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Verify GraphQL health query
        run: |
          curl -fsS http://localhost:8080/graphql \
            -H 'Content-Type: application/json' \
            -d '{"query":"query { health }"}' | grep -q '"health":"ok"'

      - name: Verify GraphQL recentSentiment query
        run: |
          curl -fsS http://localhost:8080/graphql \
            -H 'Content-Type: application/json' \
            -d '{"query":"query RecentSentiment($streamer:String!, $limit:Int!){ recentSentiment(streamer:$streamer, limit:$limit){ sentimentEventId label } }","variables":{"streamer":"ci-test","limit":1}}' | grep -q '"sentimentEventId"'

      - name: Dump docker compose logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop stack
        if: always()
        run: docker compose down -v
