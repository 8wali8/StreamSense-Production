name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java-build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        service:
          - eureka-server
          - config-server
          - api-gateway
          - chat-service
          - sentiment-service
          - video-service
          - recommendation-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test
        working-directory: ${{ matrix.service }}
        run: mvn -B -ntp clean test

  test-ml-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: ml-engine
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff

      - name: Run lint
        working-directory: ml-engine
        run: ruff check src/main/python src/test/python

      - name: Run tests
        working-directory: ml-engine
        env:
          PYTHONPATH: src/main/python
        run: pytest src/test/python

  frontend-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run lint
        working-directory: frontend
        run: npm run lint

      - name: Run build
        working-directory: frontend
        run: npm run build

  docker-smoke:
    runs-on: ubuntu-latest
    needs:
      - java-build-test
      - test-ml-engine
      - frontend-checks

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Package baseline Java services for Docker
        run: |
          mvn -B -ntp -f eureka-server/pom.xml -DskipTests package
          mvn -B -ntp -f config-server/pom.xml -DskipTests package

      - name: Validate docker compose config
        run: docker compose config

      - name: Start Week 1 baseline stack
        run: docker compose up -d --build eureka-server config-server zipkin prometheus grafana

      - name: Wait for Eureka and Config Server
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:8761/actuator/health >/dev/null && curl -fsS http://localhost:8888/actuator/health >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Verify Config Server serves in-repo config
        run: curl -fsS http://localhost:8888/chat-service/default | grep -q '"name":"chat-service"'

      - name: Dump docker compose logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop stack
        if: always()
        run: docker compose down -v
