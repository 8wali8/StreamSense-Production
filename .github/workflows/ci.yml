name: CI

# Runs once per change: on pull requests, and on pushes to main after merge.
# Pushing a branch without a pull request does not run CI.
on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the default token can only read the repository. Jobs that
# ever need more must request it explicitly at job level.
permissions:
  contents: read

# One run per pull request (newer pushes cancel the older run); runs on main
# are never cancelled so every merge gets a complete result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decide which areas of the monorepo changed so that, for example, a frontend-only
  # change does not run eight Maven builds. A workflow edit or a config-repo edit
  # re-runs everything. Skipped jobs report as skipped, which branch protection
  # treats as passing, so required checks never hang.
  changes:
    runs-on: ubuntu-latest
    outputs:
      changes: ${{ steps.filter.outputs.changes }}
      run_all: ${{ steps.plan.outputs.run_all }}
      java_services: ${{ steps.plan.outputs.java_services }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Detect changed areas
        id: filter
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        with:
          filters: |
            workflow:
              - '.github/workflows/**'
            java-shared:
              - 'config-server/config-repo/**'
            eureka-server:
              - 'eureka-server/**'
            config-server:
              - 'config-server/**'
            api-gateway:
              - 'api-gateway/**'
            chat-service:
              - 'chat-service/**'
            sentiment-service:
              - 'sentiment-service/**'
            video-service:
              - 'video-service/**'
            recommendation-service:
              - 'recommendation-service/**'
            analytics-service:
              - 'analytics-service/**'
            ml-engine:
              - 'ml-engine/**'
            video-capture-service:
              - 'video-capture-service/**'
            frontend:
              - 'frontend/**'
            k8s:
              - 'k8s/**'
            smoke:
              - 'docker-compose.yml'
              - 'makefile'
              - 'tools/**'
              - 'secrets/**'
              - 'config-server/**'
              - 'eureka-server/**'
              - 'api-gateway/**'
              - 'chat-service/**'
              - 'sentiment-service/**'
              - 'video-service/**'
              - 'recommendation-service/**'
              - 'analytics-service/**'
              - 'ml-engine/**'
              - 'video-capture-service/**'

      - name: Plan jobs
        id: plan
        env:
          CHANGES: ${{ steps.filter.outputs.changes }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          changed = set(json.loads(os.environ["CHANGES"]))
          services = ["eureka-server", "config-server", "api-gateway", "chat-service",
                      "sentiment-service", "video-service", "recommendation-service", "analytics-service"]
          run_all = bool(changed & {"workflow", "java-shared"})
          java = services if run_all else [s for s in services if s in changed]
          print(f"run_all={str(run_all).lower()}")
          print(f"java_services={json.dumps(java)}")
          EOF
          cat "$GITHUB_OUTPUT"

  java-build-test:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.java_services != '[]'
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.java_services) }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Resolve dependencies (retry on Maven Central throttling)
        working-directory: ${{ matrix.service }}
        run: |
          for i in 1 2 3 4; do
            mvn -B -ntp dependency:go-offline && break
            if [ "$i" = "4" ]; then
              echo "dependency resolution failed after 4 attempts"
              exit 1
            fi
            echo "dependency resolution failed (attempt $i); retrying in $((i * 45))s..."
            sleep $((i * 45))
          done

      - name: Build and test
        working-directory: ${{ matrix.service }}
        run: mvn -B -ntp clean test

  test-ml-engine:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run_all == 'true' || contains(fromJSON(needs.changes.outputs.changes), 'ml-engine')

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: ml-engine
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff==0.16.3

      - name: Run lint
        working-directory: ml-engine
        run: ruff check src/main/python src/test/python

      - name: Run tests
        working-directory: ml-engine
        env:
          PYTHONPATH: src/main/python
        run: pytest src/test/python

  test-video-capture-service:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run_all == 'true' || contains(fromJSON(needs.changes.outputs.changes), 'video-capture-service')

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: video-capture-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        working-directory: video-capture-service
        env:
          PYTHONPATH: src/main/python
        run: pytest src/test/python

  frontend-checks:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run_all == 'true' || contains(fromJSON(needs.changes.outputs.changes), 'frontend')

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run lint
        working-directory: frontend
        run: npm run lint

      - name: Run tests
        working-directory: frontend
        run: npm run test

      - name: Run build
        working-directory: frontend
        run: npm run build

  validate-k8s-manifests:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run_all == 'true' || contains(fromJSON(needs.changes.outputs.changes), 'k8s')

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4.0.1
        with:
          version: 'v1.30.0'

      - name: Validate kustomize renders without errors
        run: kubectl kustomize k8s > /dev/null

      - name: Validate Grafana dashboard JSON
        run: |
          python3 -c "
          import yaml, json, sys
          with open('k8s/config/grafana-config.yaml') as f:
              docs = list(yaml.safe_load_all(f))
          cm = next(d for d in docs if d['metadata']['name'] == 'grafana-dashboards')
          for name, content in cm['data'].items():
              try:
                  json.loads(content)
                  print(f'OK: {name}')
              except json.JSONDecodeError as e:
                  print(f'INVALID: {name}: {e}', file=sys.stderr)
                  sys.exit(1)
          "

  docker-smoke:
    runs-on: ubuntu-latest
    needs:
      - changes
      - java-build-test
      - test-ml-engine
      - test-video-capture-service
      - frontend-checks
      - validate-k8s-manifests
    # Upstream jobs may be skipped; only a real failure or a cancel stops the smoke run.
    if: >-
      !cancelled()
      && !contains(needs.*.result, 'failure')
      && (needs.changes.outputs.run_all == 'true' || contains(fromJSON(needs.changes.outputs.changes), 'smoke'))

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Package Java services for Docker
        run: |
          mvn -B -ntp -f eureka-server/pom.xml -DskipTests package
          mvn -B -ntp -f config-server/pom.xml -DskipTests package
          mvn -B -ntp -f api-gateway/pom.xml -DskipTests package
          mvn -B -ntp -f chat-service/pom.xml -DskipTests package
          mvn -B -ntp -f recommendation-service/pom.xml -DskipTests package
          mvn -B -ntp -f sentiment-service/pom.xml -DskipTests package
          mvn -B -ntp -f video-service/pom.xml -DskipTests package
          mvn -B -ntp -f analytics-service/pom.xml -DskipTests package

      - name: Validate docker compose config
        run: docker compose config

      - name: Build smoke images
        run: docker compose build eureka-server config-server ml-engine sentiment-service chat-service recommendation-service video-service analytics-service video-capture-service api-gateway

      - name: Reset smoke stack state
        run: docker compose down -v --remove-orphans || true

      - name: Start core smoke stack
        run: |
          for attempt in 1 2; do
            if docker compose up -d zookeeper kafka kafka-topics-init postgres redis minio eureka-server config-server ml-engine sentiment-service chat-service recommendation-service video-service analytics-service video-capture-service kafka-exporter; then
              exit 0
            fi

            echo "Core smoke stack startup attempt ${attempt} failed"
            docker compose ps || true
            docker compose logs --no-color || true
            docker compose down -v --remove-orphans || true
            sleep 10
          done

          exit 1

      - name: Wait for core services
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:8761/actuator/health >/dev/null && curl -fsS http://localhost:8888/actuator/health >/dev/null && curl -fsS http://localhost:8081/actuator/health >/dev/null && curl -fsS http://localhost:8082/actuator/health >/dev/null && curl -fsS http://localhost:8083/actuator/health >/dev/null && curl -fsS http://localhost:8084/actuator/health >/dev/null && curl -fsS http://localhost:8085/actuator/health >/dev/null && curl -fsS http://localhost:8090/health >/dev/null && curl -fsS http://localhost:8000/ml/health >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Start gateway after core services
        run: docker compose up -d api-gateway

      - name: Wait for gateway health
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:8080/actuator/health >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Verify Kafka topics exist
        run: |
          docker compose exec -T kafka kafka-topics --bootstrap-server kafka:9092 --list | grep -q '^stream.chat.messages$'
          docker compose exec -T kafka kafka-topics --bootstrap-server kafka:9092 --list | grep -q '^stream.sentiment.events$'

      - name: Verify Redis is reachable
        run: docker compose exec -T redis redis-cli ping | grep -q PONG

      - name: Verify kafka-exporter exposes broker metrics
        run: |
          for i in {1..18}; do
            if curl -fsS http://localhost:9308/metrics | grep -q 'kafka_brokers'; then
              echo "kafka-exporter: OK"; exit 0
            fi
            sleep 5
          done
          echo "kafka-exporter did not expose metrics in time"; exit 1

      - name: Verify chat ingest returns event id
        run: |
          curl -fsS -X POST http://localhost:8081/api/chat/ingest \
            -H 'Content-Type: application/json' \
            -d '{"streamer":"ci-test","user":"u1","message":"hello from ci","timestamp":1710000000000}' | grep -q '"eventId"'

      - name: Wait for recent sentiment history
        run: |
          for i in {1..60}; do
            if curl -fsS "http://localhost:8083/api/sentiment/recent?streamer=ci-test&limit=1" | grep -q '"sentimentEventId"'; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Verify analytics summary route
        run: |
          curl -fsS "http://localhost:8080/api/analytics/streams/ci-test/summary?windowMinutes=15" >/dev/null

      - name: Verify GraphQL health query
        run: |
          curl -fsS http://localhost:8080/graphql \
            -H 'Content-Type: application/json' \
            -d '{"query":"query { health }"}' | grep -q '"health":"ok"'

      - name: Verify GraphQL recentSentiment query
        run: |
          curl -fsS http://localhost:8080/graphql \
            -H 'Content-Type: application/json' \
            -d '{"query":"query RecentSentiment($streamer:String!, $limit:Int!){ recentSentiment(streamer:$streamer, limit:$limit){ sentimentEventId label } }","variables":{"streamer":"ci-test","limit":1}}' | grep -q '"sentimentEventId"'

      - name: Verify GraphQL recommendations query
        run: |
          curl -fsS http://localhost:8080/graphql \
            -H 'Content-Type: application/json' \
            -d '{"query":"query Recommendations($streamer:String!, $limit:Int!){ recommendations(streamer:$streamer, limit:$limit){ recommendationId category variantId } }","variables":{"streamer":"ci-test","limit":1}}' | grep -q '"recommendationId"'

      - name: Dump docker compose logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop stack
        if: always()
        run: docker compose down -v
