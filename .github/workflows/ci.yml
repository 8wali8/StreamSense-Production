name: CI

# Runs once per change: on pull requests, and on pushes to main after merge.
# Pushing a branch without a pull request does not run CI.
on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the default token can only read the repository and, for the
# change-detection job, the pull request's file list. Jobs that ever need more
# must request it explicitly at job level.
permissions:
  contents: read
  pull-requests: read

# One run per pull request (newer pushes cancel the older run); runs on main
# are never cancelled so every merge gets a complete result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decide which areas of the monorepo changed so that, for example, a frontend-only
  # change does not run eight Maven builds. A workflow edit or a config-repo edit
  # re-runs everything. Skipped jobs report as skipped, which branch protection
  # treats as passing, so required checks never hang.
  changes:
    runs-on: ubuntu-latest
    outputs:
      changes: ${{ steps.filter.outputs.changes }}
      run_all: ${{ steps.plan.outputs.run_all }}
      java_services: ${{ steps.plan.outputs.java_services }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Detect changed areas
        id: filter
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        with:
          filters: |
            workflow:
              - '.github/workflows/**'
            java-shared:
              - 'config-server/config-repo/**'
              # The parent POM manages every version; a change there must rebuild every service.
              - 'pom.xml'
              # The schema contract tests in chat-, sentiment-, and video-service read ../docs/schemas.
              - 'docs/schemas/**'
            schemas:
              - 'docs/schemas/**'
              - 'tools/schema/**'
            dockerfiles:
              - '**/Dockerfile'
              - '.hadolint.yaml'
            eureka-server:
              - 'eureka-server/**'
            config-server:
              - 'config-server/**'
            api-gateway:
              - 'api-gateway/**'
            chat-service:
              - 'chat-service/**'
            sentiment-service:
              - 'sentiment-service/**'
            video-service:
              - 'video-service/**'
            recommendation-service:
              - 'recommendation-service/**'
            analytics-service:
              - 'analytics-service/**'
            ml-engine:
              - 'ml-engine/**'
            video-capture-service:
              - 'video-capture-service/**'
            frontend:
              - 'frontend/**'
              - 'api-gateway/src/main/resources/graphql/**'
            k8s:
              - 'k8s/**'
              # The root kustomization is the canonical entry point (it generates the config-server ConfigMap).
              - 'kustomization.yaml'
            smoke:
              - 'docker-compose.yml'
              - 'pom.xml'
              - 'makefile'
              - 'tools/**'
              - 'secrets/**'
              - 'config-server/**'
              - 'eureka-server/**'
              - 'api-gateway/**'
              - 'chat-service/**'
              - 'sentiment-service/**'
              - 'video-service/**'
              - 'recommendation-service/**'
              - 'analytics-service/**'
              - 'ml-engine/**'
              - 'video-capture-service/**'

      - name: Plan jobs
        id: plan
        env:
          CHANGES: ${{ steps.filter.outputs.changes }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          changed = set(json.loads(os.environ["CHANGES"]))
          services = ["eureka-server", "config-server", "api-gateway", "chat-service",
                      "sentiment-service", "video-service", "recommendation-service", "analytics-service"]
          run_all = bool(changed & {"workflow", "java-shared"})
          java = services if run_all else [s for s in services if s in changed]
          print(f"run_all={str(run_all).lower()}")
          print(f"java_services={json.dumps(java)}")
          EOF
          cat "$GITHUB_OUTPUT"

  java-build-test:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.java_services != '[]'
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.java_services) }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Resolve dependencies (retry on Maven Central throttling)
        working-directory: ${{ matrix.service }}
        run: |
          for i in 1 2 3 4; do
            mvn -B -ntp dependency:go-offline && break
            if [ "$i" = "4" ]; then
              echo "dependency resolution failed after 4 attempts"
              exit 1
            fi
            echo "dependency resolution failed (attempt $i); retrying in $((i * 45))s..."
            sleep $((i * 45))
          done

      - name: Build and test
        working-directory: ${{ matrix.service }}
        run: mvn -B -ntp clean verify

  test-ml-engine:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run_all == 'true' || contains(fromJSON(needs.changes.outputs.changes), 'ml-engine')

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up uv and Python 3.11
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.9"
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: ml-engine/uv.lock

      - name: Install locked dependencies
        working-directory: ml-engine
        run: uv sync --locked

      - name: Run lint
        working-directory: ml-engine
        run: uv run ruff check src tests

      - name: Check formatting
        working-directory: ml-engine
        run: uv run ruff format --check src tests

      - name: Type-check
        working-directory: ml-engine
        run: uv run mypy

      - name: Run tests
        working-directory: ml-engine
        run: uv run pytest

  test-video-capture-service:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run_all == 'true' || contains(fromJSON(needs.changes.outputs.changes), 'video-capture-service')

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up uv and Python 3.11
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.9"
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: video-capture-service/uv.lock

      - name: Install locked dependencies
        working-directory: video-capture-service
        run: uv sync --locked

      - name: Run lint
        working-directory: video-capture-service
        run: uv run ruff check src tests

      - name: Check formatting
        working-directory: video-capture-service
        run: uv run ruff format --check src tests

      - name: Type-check
        working-directory: video-capture-service
        run: uv run mypy

      - name: Run tests
        working-directory: video-capture-service
        run: uv run pytest

  schema-compat:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run_all == 'true' || contains(fromJSON(needs.changes.outputs.changes), 'schemas')

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Check event schemas stay backward compatible
        env:
          # Pull requests compare against the target branch; pushes to main against the previous commit.
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: python3 tools/schema/check_compat.py --base "$BASE"

  frontend-checks:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run_all == 'true' || contains(fromJSON(needs.changes.outputs.changes), 'frontend')

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Check generated GraphQL types match the gateway schema
        working-directory: frontend
        run: npm run codegen:check

      - name: Run lint
        working-directory: frontend
        run: npm run lint

      - name: Check formatting
        working-directory: frontend
        run: npm run format:check

      - name: Run tests with coverage thresholds
        working-directory: frontend
        run: npm run test:coverage

      - name: Run build
        working-directory: frontend
        run: npm run build

  validate-k8s-manifests:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run_all == 'true' || contains(fromJSON(needs.changes.outputs.changes), 'k8s')

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4.0.1
        with:
          version: 'v1.30.0'

      - name: Create local secret files
        run: make secrets

      - name: Validate kustomize renders without errors
        run: kubectl kustomize . > /dev/null

      # Every dependency the manifests, config-repo, Prometheus targets, nginx proxies, and Ingress declare
      # must be allowed by k8s/network/network-policies.yaml (default-deny plus per-workload allows).
      - name: Network policies cover every declared dependency
        run: python3 tools/k8s/check_network_policies.py

      - name: Validate Grafana dashboard JSON
        run: |
          python3 -c "
          import yaml, json, sys
          with open('k8s/config/grafana-config.yaml') as f:
              docs = list(yaml.safe_load_all(f))
          cm = next(d for d in docs if d['metadata']['name'] == 'grafana-dashboards')
          for name, content in cm['data'].items():
              try:
                  json.loads(content)
                  print(f'OK: {name}')
              except json.JSONDecodeError as e:
                  print(f'INVALID: {name}: {e}', file=sys.stderr)
                  sys.exit(1)
          "

  # ---------------------------------------------------------------------------------------------
  # Supply chain: Dockerfile lint, vulnerability and misconfiguration scan, and an SBOM on main.
  # ---------------------------------------------------------------------------------------------
  dockerfile-lint:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run_all == 'true' || contains(fromJSON(needs.changes.outputs.changes), 'dockerfiles')

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: hadolint every Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          recursive: true
          config: .hadolint.yaml

  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Dependencies (pom.xml, uv.lock, package-lock.json) and secrets in the tree. Fails on HIGH/CRITICAL
      # findings that have a fix available; suppressions live in .trivyignore with a reason.
      - name: Trivy vulnerability and secret scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: sarif
          output: trivy-results.sarif
          trivyignores: .trivyignore
          # SARIF output ignores the severity filter unless this is set, and every reported finding
          # (MEDIUM included) would then trip exit-code 1.
          limit-severities-for-sarif: true

      # Dockerfiles, Compose, and Kubernetes manifests: HIGH and CRITICAL misconfigurations fail the job.
      - name: Trivy misconfiguration gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table
          trivyignores: .trivyignore

      - name: Upload scan results to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@a45bef097606dca6eac8285c279babedd70e6dfd # v3.37.9
        with:
          sarif_file: trivy-results.sarif

  sbom:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Generate a CycloneDX SBOM for the repository
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: cyclonedx-json
          artifact-name: streamsense-sbom.cdx.json
          upload-artifact: true
          upload-release-assets: false

  docker-smoke:
    runs-on: ubuntu-latest
    needs:
      - changes
      - java-build-test
      - test-ml-engine
      - test-video-capture-service
      - frontend-checks
      - validate-k8s-manifests
    # Upstream jobs may be skipped; only a real failure or a cancel stops the smoke run.
    if: >-
      !cancelled()
      && !contains(needs.*.result, 'failure')
      && (needs.changes.outputs.run_all == 'true' || contains(fromJSON(needs.changes.outputs.changes), 'smoke'))

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Package Java services for Docker
        run: |
          mvn -B -ntp -f eureka-server/pom.xml -DskipTests package
          mvn -B -ntp -f config-server/pom.xml -DskipTests package
          mvn -B -ntp -f api-gateway/pom.xml -DskipTests package
          mvn -B -ntp -f chat-service/pom.xml -DskipTests package
          mvn -B -ntp -f recommendation-service/pom.xml -DskipTests package
          mvn -B -ntp -f sentiment-service/pom.xml -DskipTests package
          mvn -B -ntp -f video-service/pom.xml -DskipTests package
          mvn -B -ntp -f analytics-service/pom.xml -DskipTests package

      - name: Create local secret files
        run: make secrets

      - name: Validate docker compose config
        run: docker compose config

      - name: Build smoke images
        run: docker compose build eureka-server config-server ml-engine sentiment-service chat-service recommendation-service video-service analytics-service video-capture-service api-gateway

      - name: Reset smoke stack state
        run: docker compose down -v --remove-orphans || true

      - name: Start core smoke stack
        run: |
          for attempt in 1 2; do
            if docker compose up -d kafka kafka-topics-init postgres redis minio eureka-server config-server ml-engine sentiment-service chat-service recommendation-service video-service analytics-service video-capture-service kafka-exporter; then
              exit 0
            fi

            echo "Core smoke stack startup attempt ${attempt} failed"
            docker compose ps || true
            docker compose logs --no-color || true
            docker compose down -v --remove-orphans || true
            sleep 10
          done

          exit 1

      - name: Wait for core services
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:8761/actuator/health >/dev/null && curl -fsS http://localhost:8888/actuator/health >/dev/null && curl -fsS http://localhost:8081/actuator/health >/dev/null && curl -fsS http://localhost:8082/actuator/health >/dev/null && curl -fsS http://localhost:8083/actuator/health >/dev/null && curl -fsS http://localhost:8084/actuator/health >/dev/null && curl -fsS http://localhost:8085/actuator/health >/dev/null && curl -fsS http://localhost:8090/health >/dev/null && curl -fsS http://localhost:8000/ml/health >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Start gateway after core services
        run: docker compose up -d api-gateway

      - name: Wait for gateway health
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:8080/actuator/health >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Verify Kafka topics exist
        run: |
          docker compose exec -T kafka kafka-topics --bootstrap-server kafka:9092 --list | grep -q '^stream.chat.messages$'
          docker compose exec -T kafka kafka-topics --bootstrap-server kafka:9092 --list | grep -q '^stream.sentiment.events$'

      - name: Verify Redis is reachable
        run: docker compose exec -T redis redis-cli ping | grep -q PONG

      - name: Verify kafka-exporter exposes broker metrics
        run: |
          for i in {1..18}; do
            if curl -fsS http://localhost:9308/metrics | grep -q 'kafka_brokers'; then
              echo "kafka-exporter: OK"; exit 0
            fi
            sleep 5
          done
          echo "kafka-exporter did not expose metrics in time"; exit 1

      - name: Verify chat ingest returns event id
        run: |
          curl -fsS -X POST http://localhost:8081/api/chat/ingest \
            -H 'Content-Type: application/json' \
            -d '{"streamer":"ci-test","user":"u1","message":"hello from ci","timestamp":1710000000000}' | grep -q '"eventId"'

      - name: Wait for recent sentiment history
        run: |
          for i in {1..60}; do
            if curl -fsS "http://localhost:8083/api/sentiment/recent?streamer=ci-test&limit=1" | grep -q '"sentimentEventId"'; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Verify analytics summary route
        run: |
          curl -fsS "http://localhost:8080/api/analytics/streams/ci-test/summary?windowMinutes=15" >/dev/null

      - name: Verify GraphQL health query
        run: |
          curl -fsS http://localhost:8080/graphql \
            -H 'Content-Type: application/json' \
            -d '{"query":"query { health }"}' | grep -q '"health":"ok"'

      - name: Verify GraphQL recentSentiment query
        run: |
          curl -fsS http://localhost:8080/graphql \
            -H 'Content-Type: application/json' \
            -d '{"query":"query RecentSentiment($streamer:String!, $limit:Int!){ recentSentiment(streamer:$streamer, limit:$limit){ sentimentEventId label } }","variables":{"streamer":"ci-test","limit":1}}' | grep -q '"sentimentEventId"'

      - name: Verify GraphQL recommendations query
        run: |
          curl -fsS http://localhost:8080/graphql \
            -H 'Content-Type: application/json' \
            -d '{"query":"query Recommendations($streamer:String!, $limit:Int!){ recommendations(streamer:$streamer, limit:$limit){ recommendationId category variantId } }","variables":{"streamer":"ci-test","limit":1}}' | grep -q '"recommendationId"'

      - name: Dump docker compose logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop stack
        if: always()
        run: docker compose down -v

  # Stable aggregate check for branch protection. Every other job can be skipped
  # by the path filter, so requiring them by name would leave a PR pending when
  # they never run. Require this job instead: it always runs last and fails only
  # when some job actually failed or was cancelled.
  ci-ok:
    runs-on: ubuntu-latest
    needs:
      - changes
      - java-build-test
      - test-ml-engine
      - test-video-capture-service
      - schema-compat
      - frontend-checks
      - dockerfile-lint
      - security-scan
      - sbom
      - validate-k8s-manifests
      - docker-smoke
    if: always()
    steps:
      - name: Fail if any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "A job failed or was cancelled:"
          echo '${{ toJSON(needs) }}'
          exit 1

      - name: Report success
        run: echo "every job passed or was skipped by the path filter"
