spring:
  cloud:
    config:
      enabled: false
    gateway:
      metrics:
        enabled: true

eureka:
  client:
    enabled: false

streamsense:
  services:
    chat-service:
      base-url: http://localhost:8081
    recommendation-service:
      base-url: http://localhost:8082
    sentiment-service:
      base-url: http://localhost:8083
    video-service:
      base-url: http://localhost:8084
    video-capture-service:
      base-url: http://localhost:8090
    analytics-service:
      base-url: http://localhost:8085
    ml-engine:
      base-url: http://localhost:8000
  gateway:
    auth:
      enabled: false
      required-issuer: streamsense-local
      required-audience: streamsense-clients
