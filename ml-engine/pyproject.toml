[project]
name = "streamsense-ml-engine"
version = "0.1.0"
description = "StreamSense ML inference service: sentiment, sponsor relevance, sponsor detection, segmentation, transcription"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "python-multipart>=0.0.9,<1",
    "boto3>=1.34,<2",
    "pillow>=12.3,<13",
    "numpy>=1.26,<2",
    # CPU-only PyTorch from the PyTorch index (see [tool.uv.sources]); versions match the previous requirements.txt.
    "torch==2.2.2+cpu",
    "torchvision==0.17.2+cpu",
    "transformers==4.40.2",
    "huggingface-hub>=0.23,<1",
    "safetensors>=0.4,<1",
    "sentence-transformers==2.6.1",
    "segment-anything>=1.0,<2",
    "faster-whisper>=1.0,<2",
    "pydantic-settings>=2.5,<3",
    "prometheus-client>=0.20,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ml_engine"]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "httpx>=0.27,<1",
    "ruff==0.16.3",
    "jsonschema>=4.26,<5",
    "mypy>=1.20,<2",
]

[tool.uv]
# Resolve for the platforms the service is built (linux) and developed (windows, linux) on.
environments = ["sys_platform == 'linux'", "sys_platform == 'win32'"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# The rule families every module passes; add a family here only together with the fixes it needs.
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF", "PT", "BLE", "S", "N"]
# Event and API models keep the camelCase field names of the JSON contracts in docs/schemas.
ignore = ["N815"]

[tool.ruff.lint.isort]
known-first-party = ["ml_engine", "conftest"]

[tool.ruff.lint.per-file-ignores]
# Tests assert, carry placeholder credentials, and write under /tmp on purpose.
"tests/*" = ["S101", "S105", "S108"]
# FastAPI route parameters use File()/Depends() calls as argument defaults and carry the API's camelCase names.
"src/ml_engine/main.py" = ["B008", "N803"]
# Segmentation deliberately catches broad exceptions to fall back to degraded output.
"src/ml_engine/segmentation.py" = ["BLE001"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
